name: Quick Sync Gofile Catalog

on:
  workflow_dispatch:

jobs:
  quick-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Playwright Chromium Binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install dependencies
        run: |
          pip install aiohttp requests parse-torrent-title playwright

      - name: Install Playwright Chromium with OS Dependencies
        run: |
          # If binary is restored from cache, only install linux system libraries
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Run Quick Sync
        env:
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
        run: python quick_sync.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json knowledge.json sync_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ Quick sync: updated catalog and state" && git push)
