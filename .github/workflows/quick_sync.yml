name: Quick Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.40.0-jammy # Chromium is already pre-installed!
    steps:
      - uses: actions/checkout@v4

      - name: Run Crawler
        run: |
          python -m pip install -r requirements.txt
          python crawler.py --quick
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          CF_WORKER_URL: "https://gofile2stremio.c238ooking.workers.dev/sync"
