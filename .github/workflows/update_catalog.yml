name: Update Gofile Catalog

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Chromium
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run Safe Crawler
        env:
          GOFILE_API_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
        run: python crawler.py

      - name: Commit and push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f data.json ]; then
            git add data.json
            if git diff --staged --quiet; then
              echo "No changes in data.json."
            else
              git commit -m "Auto-update Gofile catalog [skip ci]"
              git push
            fi
          fi
