name: Update Gofile Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Purge all Google repository definitions causing CDN hash sum mismatches
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/chrome*.list
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          
          python -m pip install --upgrade pip
          pip install requests urllib3 playwright parse-torrent-title
          playwright install chromium --with-deps

      - name: Run Crawler
        run: |
          python crawler.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json knowledge.json
          git diff --staged --quiet || (git commit -m "Automated catalog sync [skip ci]" && git push)
