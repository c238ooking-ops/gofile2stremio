name: Update Gofile Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Gofile Fetch and Generate Data
        run: node generate-catalog.js
        env:
          GOFILE_API_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}

      - name: Notify Cloudflare Worker to Redo Database
        run: |
          curl -X POST "https://gofile2stremio.c238ooking.workers.dev/webhook-sync" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_SECRET }}" \
            -d @data.json
