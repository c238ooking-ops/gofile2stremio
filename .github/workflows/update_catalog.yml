name: Update Gofile Catalog

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 parse-torrent-title playwright

      - name: Fix APT Mirrors and Install Playwright Chromium
        run: |
          # Remove broken Google Chrome apt list that causes hash sum mismatches
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          
          # Install browser dependencies safely without breaking on mirror errors
          playwright install-deps chromium || true
          playwright install chromium

      - name: Run Crawler
        run: |
          python crawler.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data.json knowledge.json
          
          if git diff --staged --quiet; then
            echo "No changes detected in catalog or knowledge base."
          else
            git commit -m "Auto-update Gofile catalog and knowledge base [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
