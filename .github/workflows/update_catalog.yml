name: Update Gofile Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Purge any Google repo in both .list and new Ubuntu 24.04 .sources formats
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*
          
          python -m pip install --upgrade pip
          pip install requests urllib3 playwright parse-torrent-title aiohttp
          # Download standalone Chromium binary without invoking broken apt mirrors
          playwright install chromium

      - name: Run Crawler & Push to KV
        env:
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
        run: |
          python crawler.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json knowledge.json
          git diff --staged --quiet || (git commit -m "Automated catalog sync [skip ci]" && git push)
