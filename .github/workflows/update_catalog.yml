name: Update Gofile Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Shallow clone for speed
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Setup Python with native pip caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Cache Playwright Chromium binary to eliminate redundant browser downloads
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      # 4. Install dependencies using pip cache
      - name: Install dependencies
        run: |
          pip install requests urllib3 playwright parse-torrent-title

      # 5. Install Chromium binary only on cache miss
      - name: Install Chromium binary (Cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      # 6. Execute Catalog Crawler with environment secrets
      - name: Run Crawler
        env:
          GOFILE_ROOT_FOLDER_ID: "OBVVp1LI"
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: python crawler.py

      # 7. Commit and push updated catalog data
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json knowledge.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ Automated catalog sync [skip ci]" && git push)
