name: Update Gofile Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests aiohttp parse-torrent-title urllib3

      - name: Run Crawler & Push to KV
        env:
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
          GOFILE_SESSION_JSON: ${{ secrets.GOFILE_SESSION_JSON }}
        run: |
          python crawler.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json knowledge.json
          git diff --staged --quiet || (git commit -m "Automated catalog sync [skip ci]" && git push)
