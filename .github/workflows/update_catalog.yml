name: Update Gofile Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Full clone to ensure commits push cleanly
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 playwright parse-torrent-title

      # 4. Cache Playwright browser binaries tied to the installed Playwright version
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      # 5. Install Chromium & Headless Shell with system dependencies if missing
      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      # 6. Execute Crawler
      - name: Run Crawler
        env:
          GOFILE_ROOT_FOLDER_ID: "OBVVp1LI"
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: python crawler.py

      # 7. Commit and push updated catalog data
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json knowledge.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ Automated catalog sync [skip ci]" && git push origin HEAD)
