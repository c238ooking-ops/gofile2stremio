name: Update Gofile Catalog

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:        # Allows 1-click manual trigger

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Chromium
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run Crawler
        run: python crawler.py

      - name: Commit and push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f data.json ]; then
            git add data.json
            if git diff --staged --quiet; then
              echo "No changes in data.json. Nothing to commit."
            else
              git commit -m "Auto-update Gofile catalog [skip ci]"
              git push
            fi
          else
            echo "::error::data.json was not generated."
            exit 1
          fi
