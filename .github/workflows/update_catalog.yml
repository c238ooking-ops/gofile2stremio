name: Update Gofile Catalog

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual 1-click execution in the Actions tab

# Required permissions to commit and push changes back to the repository
permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Crawler
        env:
          GOFILE_API_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
        run: python crawler.py

      - name: Commit and push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f data.json ]; then
            git add data.json
            # Only commit if data.json has changes; prevent non-zero exit if unchanged
            if git diff --staged --quiet; then
              echo "No changes detected in data.json. Nothing to commit."
            else
              git commit -m "Auto-update Gofile catalog [skip ci]"
              git push
            fi
          else
            echo "::error::data.json was not generated by crawler.py"
            exit 1
          fi
