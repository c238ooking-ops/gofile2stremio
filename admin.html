<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Movie Vault Pro - Catalog Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0d14;
    --bg-card: #13151f;
    --bg-card-hover: #1a1d2b;
    --border: #232738;
    --border-highlight: #3b4261;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-glow: rgba(99, 102, 241, 0.25);
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  /* Responsive Top Header */
  header {
    background: rgba(19, 21, 31, 0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  @media (min-width: 768px) {
    header {
      padding: 16px 28px;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  @media (min-width: 768px) {
    .header-top {
      width: auto;
    }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-logo {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px var(--accent-glow);
    font-size: 18px;
  }
  .brand-text h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .brand-text p { font-size: 10px; color: var(--text-sub); }

  /* Universal Responsive Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    flex-wrap: wrap;
  }

  @media (min-width: 768px) {
    .toolbar {
      width: auto;
      flex-wrap: nowrap;
      gap: 10px;
    }
  }

  .search-wrapper {
    position: relative;
    flex: 1 1 100%;
  }

  @media (min-width: 768px) {
    .search-wrapper {
      flex: initial;
      min-width: 240px;
    }
  }

  .search-input {
    width: 100%;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px 8px 34px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
  }

  .filter-select {
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 12px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 12px;
    outline: none;
    cursor: pointer;
    flex: 1;
  }

  @media (min-width: 768px) {
    .filter-select {
      flex: initial;
      font-size: 13px;
      padding: 8px 16px;
    }
  }

  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
    white-space: nowrap;
    min-height: 36px;
  }

  @media (min-width: 768px) {
    .btn {
      padding: 8px 18px;
      font-size: 13px;
    }
  }

  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-sub);
  }
  .btn-outline:hover { background: var(--bg-card); color: var(--text-main); border-color: var(--border-highlight); }
  .btn-success { background: var(--green); }
  .btn-success:hover { background: #059669; }

  /* Fluid Responsive Grid */
  main {
    flex: 1;
    padding: 16px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
  }

  @media (min-width: 768px) {
    main { padding: 24px; }
  }
  @media (min-width: 1024px) {
    main { padding: 32px; }
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    color: var(--text-sub);
    font-size: 12px;
    gap: 10px;
  }

  /* 2 cols on mobile -> 3-4 on tab -> 6-8 on wide PC */
  .poster-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (min-width: 480px) {
    .poster-grid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }
  }
  @media (min-width: 768px) {
    .poster-grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
    }
  }
  @media (min-width: 1200px) {
    .poster-grid {
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 22px;
    }
  }

  /* Vault Card */
  .vault-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .vault-card:active, .vault-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }

  .card-media {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    background: #000;
    overflow: hidden;
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .badge-tag {
    position: absolute;
    top: 6px;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
  }
  .badge-type {
    left: 6px;
    background: rgba(12, 13, 20, 0.85);
    color: var(--text-main);
    border: 1px solid var(--border);
  }
  .badge-year {
    right: 6px;
    background: rgba(12, 13, 20, 0.85);
    color: var(--gold);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }
  .badge-count {
    bottom: 6px;
    right: 6px;
    background: rgba(99, 102, 241, 0.9);
    color: #fff;
  }

  .card-info {
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  @media (min-width: 768px) {
    .card-info { padding: 12px; gap: 4px; }
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-main);
  }
  @media (min-width: 768px) {
    .card-title { font-size: 13px; }
  }

  .card-sub {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--text-muted);
  }
  .card-imdb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--gold);
  }

  /* Responsive Modal / Drawer */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: none;
    align-items: flex-end;
  }

  @media (min-width: 860px) {
    .drawer-overlay {
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
  }

  .drawer {
    width: 100%;
    max-height: 90vh;
    background: var(--bg-card);
    border-top: 1px solid var(--border-highlight);
    border-radius: 20px 20px 0 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.25s ease-out;
  }

  @media (min-width: 860px) {
    .drawer {
      max-width: 820px;
      border-radius: 16px;
      border: 1px solid var(--border-highlight);
      animation: zoomIn 0.2s ease-out;
    }
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes zoomIn {
    from { transform: scale(0.96); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .drawer-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: rgba(12, 13, 20, 0.6);
  }
  @media (min-width: 768px) {
    .drawer-header { padding: 18px 28px; }
  }

  .drawer-title-group h2 { font-size: 16px; font-weight: 600; }
  .drawer-title-group p { font-size: 11px; color: var(--text-sub); }

  .drawer-body {
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    -webkit-overflow-scrolling: touch;
  }
  @media (min-width: 768px) {
    .drawer-body { padding: 24px 28px; gap: 22px; }
  }

  /* Adaptive Form Grid */
  .form-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }

  @media (min-width: 580px) {
    .form-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 20px;
      padding: 18px;
    }
  }

  .form-poster-preview {
    width: 100px;
    aspect-ratio: 2 / 3;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
    align-self: center;
  }
  @media (min-width: 580px) {
    .form-poster-preview {
      width: 120px;
      align-self: start;
    }
  }

  .form-poster-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .fields-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    align-content: start;
  }
  @media (min-width: 480px) {
    .fields-layout {
      grid-template-columns: 1fr 1fr;
    }
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-group.span-full {
    grid-column: 1 / -1;
  }
  .form-group label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-input {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 12px;
    outline: none;
    width: 100%;
  }
  .form-input:focus { border-color: var(--accent); }

  /* Stream Items */
  .stream-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stream-box h3 { font-size: 13px; font-weight: 600; color: var(--text-sub); }
  .stream-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stream-item {
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @media (min-width: 580px) {
    .stream-item {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
  }

  .stream-left {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .stream-name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stream-meta {
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .stream-actions {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  @media (min-width: 580px) {
    .stream-actions {
      width: auto;
    }
  }
  .stream-actions button {
    flex: 1;
  }
  @media (min-width: 580px) {
    .stream-actions button {
      flex: initial;
    }
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    left: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-highlight);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    z-index: 300;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.25s ease-out;
  }
  @media (min-width: 480px) {
    .toast {
      left: auto;
      max-width: 380px;
    }
  }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">
      <div class="brand-logo">🎬</div>
      <div class="brand-text">
        <h1>Movie Vault Pro</h1>
        <p>Catalog Manager & Studio</p>
      </div>
    </div>
    <button class="btn btn-success" id="saveAllBtn" onclick="saveToGitHub()">💾 Commit</button>
  </div>

  <div class="toolbar">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search title, IMDb, file..." oninput="filterCatalog()">
    </div>

    <select id="typeFilter" class="filter-select" onchange="filterCatalog()">
      <option value="all">All Content</option>
      <option value="movie">Movies</option>
      <option value="series">Series</option>
    </select>

    <button class="btn btn-outline" onclick="loadCatalog()">🔄 Refresh</button>
  </div>
</header>

<main>
  <div class="stats-bar">
    <span id="statsLabel">Connecting to vault...</span>
    <span id="stateIndicator">🟢 KV Synced</span>
  </div>

  <div class="poster-grid" id="vaultGrid"></div>
</main>

<!-- Edit Drawer -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
  <div class="drawer">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <h2 id="drawerTitle">Edit Title</h2>
        <p id="drawerSub">Adjust metadata and stream tags</p>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn btn-outline" style="font-size:11px; padding:6px 10px;" onclick="autoFetchCinemeta()">✨ Auto IMDb</button>
        <button class="btn btn-outline" style="font-size:11px; padding:6px 10px;" onclick="consolidateSpecials()">🎬 Specials</button>
        <button class="btn btn-outline" style="font-size:11px; padding:6px 10px;" onclick="closeDrawerDirect()">✕</button>
      </div>
    </div>

    <div class="drawer-body">
      <!-- Metadata form -->
      <div class="form-grid">
        <div class="form-poster-preview">
          <img id="formPosterImg" src="" alt="Poster" onerror="this.src='https://placehold.co/300x450/13151f/94a3b8?text=No+Poster'">
        </div>
        <div class="fields-layout">
          <div class="form-group span-full">
            <label>Canonical Title</label>
            <input type="text" id="formTitle" class="form-input" oninput="updateActiveGroupMeta('title', this.value)">
          </div>
          <div class="form-group">
            <label>IMDb ID (tt...)</label>
            <input type="text" id="formImdb" class="form-input" oninput="updateActiveGroupMeta('imdb_id', this.value)">
          </div>
          <div class="form-group">
            <label>Media Type</label>
            <select id="formType" class="form-input" onchange="updateActiveGroupMeta('type', this.value)">
              <option value="movie">Movie</option>
              <option value="series">Series</option>
            </select>
          </div>
          <div class="form-group span-full">
            <label>Poster Image URL</label>
            <input type="text" id="formPoster" class="form-input" oninput="updatePosterPreview(this.value)">
          </div>
        </div>
      </div>

      <!-- Linked Streams -->
      <div class="stream-box">
        <h3>Linked Streams & Episodes (<span id="streamCount">0</span>)</h3>
        <div class="stream-list" id="streamList"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ Notification</div>

<script>
  const GITHUB_REPO = "c238ooking-ops/gofile2stremio";
  const GITHUB_RAW = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/data.json`;
  const WORKER_SYNC_URL = "https://gofile2stremio.c238ooking.workers.dev/sync";

  let rawCatalog = [];
  let groupedCatalog = [];
  let activeGroup = null;

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
  }

  async function loadCatalog() {
    document.getElementById("statsLabel").innerText = "Loading catalog data...";
    try {
      const res = await fetch(`${GITHUB_RAW}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      rawCatalog = await res.json();
      aggregateVault();
      renderGrid();
      document.getElementById("statsLabel").innerText = `Vault: ${groupedCatalog.length} titles | ${rawCatalog.length} streams`;
    } catch (e) {
      document.getElementById("statsLabel").innerText = `Load error: ${e.message}`;
    }
  }

  function aggregateVault() {
    const map = new Map();
    rawCatalog.forEach(item => {
      const key = item.imdb_id || item.title;
      if (!map.has(key)) {
        let year = "";
        const ym = (item.title || "").match(/\b(19\d\d|20\d\d)\b/);
        if (ym) year = ym[1];

        map.set(key, {
          id: key,
          title: item.title || item.name,
          type: item.type || "movie",
          poster: item.poster && !item.poster.includes("logo-small") ? item.poster : "",
          year: year,
          streams: []
        });
      }
      const g = map.get(key);
      if (!g.poster && item.poster && !item.poster.includes("logo-small")) {
        g.poster = item.poster;
      }
      g.streams.push(item);
    });

    groupedCatalog = Array.from(map.values()).sort((a, b) => a.title.localeCompare(b.title));
  }

  function renderGrid() {
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const type = document.getElementById("typeFilter").value;
    const grid = document.getElementById("vaultGrid");
    grid.innerHTML = "";

    const filtered = groupedCatalog.filter(g => {
      const matchesType = (type === "all") || (g.type === type);
      const matchesQ = !q ||
        g.title.toLowerCase().includes(q) ||
        g.id.toLowerCase().includes(q) ||
        g.streams.some(s => s.name && s.name.toLowerCase().includes(q));
      return matchesType && matchesQ;
    });

    filtered.forEach(g => {
      const card = document.createElement("div");
      card.className = "vault-card";
      card.onclick = () => openDrawer(g);

      const isSeries = g.type === "series" || g.streams.length > 1;
      const countTag = isSeries
        ? `<span class="badge-tag badge-count">${g.streams.length} Files</span>`
        : (g.streams[0]?.quality ? `<span class="badge-tag badge-count">${g.streams[0].quality}</span>` : "");

      const fallback = `https://placehold.co/300x450/13151f/94a3b8?text=${encodeURIComponent(g.title)}`;
      const poster = g.poster || fallback;

      card.innerHTML = `
        <div class="card-media">
          <img src="${poster}" alt="${escapeHtml(g.title)}" loading="lazy" onerror="this.src='${fallback}'">
          <span class="badge-tag badge-type">${g.type}</span>
          ${g.year ? `<span class="badge-tag badge-year">${g.year}</span>` : ""}
          ${countTag}
        </div>
        <div class="card-info">
          <div class="card-title" title="${escapeHtml(g.title)}">${escapeHtml(g.title)}</div>
          <div class="card-sub">
            <span class="card-imdb">${escapeHtml(g.id.startsWith("tt") ? g.id : "")}</span>
            <span>★</span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function filterCatalog() {
    renderGrid();
  }

  function openDrawer(group) {
    activeGroup = group;
    document.getElementById("drawerTitle").innerText = group.title;
    document.getElementById("drawerSub").innerText = `${group.type.toUpperCase()} • ${group.streams.length} stream links`;
    document.getElementById("formTitle").value = group.title;
    document.getElementById("formImdb").value = group.id;
    document.getElementById("formType").value = group.type;
    document.getElementById("formPoster").value = group.poster;
    document.getElementById("formPosterImg").src = group.poster || "https://placehold.co/300x450/13151f/94a3b8?text=No+Poster";
    document.getElementById("streamCount").innerText = group.streams.length;

    renderDrawerStreams();
    document.getElementById("drawerOverlay").style.display = "flex";
  }

  function renderDrawerStreams() {
    const list = document.getElementById("streamList");
    list.innerHTML = "";

    activeGroup.streams.forEach(s => {
      const row = document.createElement("div");
      row.className = "stream-item";

      const label = s.season !== undefined && s.episode !== undefined
        ? `S${String(s.season).padStart(2, '0')}E${String(s.episode).padStart(2, '0')}`
        : (s.edition || "Main");

      row.innerHTML = `
        <div class="stream-left">
          <div class="stream-name">${escapeHtml(s.name)}</div>
          <div class="stream-meta">
            <span>[${escapeHtml(label)}]</span>
            <span>${escapeHtml(s.quality || '1080P')}</span>
            <span>${escapeHtml(s.size || '')}</span>
          </div>
        </div>
        <div class="stream-actions">
          <button class="btn btn-outline" style="padding:5px 12px; font-size:11px;" onclick="window.open('${escapeHtml(s.link)}', '_blank')">Stream</button>
          <button class="btn btn-outline" style="padding:5px 12px; font-size:11px;" onclick="reassignPrompt('${s.file_id}')">Move</button>
        </div>
      `;
      list.appendChild(row);
    });
  }

  function updatePosterPreview(url) {
    document.getElementById("formPosterImg").src = url || "https://placehold.co/300x450/13151f/94a3b8?text=No+Poster";
    updateActiveGroupMeta('poster', url);
  }

  function updateActiveGroupMeta(key, value) {
    if (!activeGroup) return;
    activeGroup[key] = value;
    activeGroup.streams.forEach(s => {
      if (key === 'title') s.title = value;
      if (key === 'imdb_id') {
        s.imdb_id = value;
        if (s.type === 'series') {
          s.stream_id = `${value}:${s.season || 1}:${s.episode || 1}`;
          s.stream_ids = [s.stream_id];
        } else {
          s.stream_id = value;
          s.stream_ids = [value];
        }
      }
      if (key === 'type') s.type = value;
      if (key === 'poster') s.poster = value;
    });
  }

  async function autoFetchCinemeta() {
    const imdb = document.getElementById("formImdb").value.trim();
    const title = document.getElementById("formTitle").value.trim();
    const type = document.getElementById("formType").value;

    if (!imdb && !title) {
      alert("Provide an IMDb ID or Title to match.");
      return;
    }

    try {
      if (imdb.startsWith("tt")) {
        const r = await fetch(`https://v3-cinemeta.strem.io/meta/${type}/${imdb}.json`);
        const d = await r.json();
        if (d && d.meta) {
          applyMeta(d.meta);
          return;
        }
      }

      const query = encodeURIComponent(title);
      const sr = await fetch(`https://v3-cinemeta.strem.io/catalog/${type}/top/search=${query}.json`);
      const sd = await sr.json();
      if (sd && sd.metas && sd.metas.length > 0) {
        applyMeta(sd.metas[0]);
      } else {
        alert("No Cinemeta record found.");
      }
    } catch (e) {
      alert("Auto match notice: " + e.message);
    }
  }

  function applyMeta(m) {
    document.getElementById("formTitle").value = m.name;
    document.getElementById("formImdb").value = m.imdb_id || m.id;
    if (m.poster) {
      document.getElementById("formPoster").value = m.poster;
      document.getElementById("formPosterImg").src = m.poster;
    }
    updateActiveGroupMeta('title', m.name);
    updateActiveGroupMeta('imdb_id', m.imdb_id || m.id);
    if (m.poster) updateActiveGroupMeta('poster', m.poster);
    showToast(`✨ Matched: ${m.name}`);
  }

  function consolidateSpecials() {
    if (!activeGroup) return;
    let count = 0;
    activeGroup.streams.forEach((s, idx) => {
      const n = (s.name || "").toLowerCase();
      if (n.includes("special") || n.includes("extra") || n.includes("bonus") || n.includes("deleted")) {
        s.season = 0;
        s.episode = idx + 1;
        s.stream_id = `${activeGroup.id}:0:${s.episode}`;
        s.stream_ids = [s.stream_id];
        count++;
      }
    });
    renderDrawerStreams();
    showToast(`Consolidated ${count} specials into Season 0`);
  }

  function reassignPrompt(fileId) {
    const target = prompt("Enter target IMDb ID or Title to move this file to:");
    if (!target) return;

    const item = rawCatalog.find(i => i.file_id === fileId);
    if (item) {
      item.imdb_id = target;
      item.title = target;
      aggregateVault();
      closeDrawerDirect();
      renderGrid();
      showToast("File reassigned to new title.");
    }
  }

  async function saveToGitHub() {
    const pat = localStorage.getItem("GH_PAT") || prompt("Enter GitHub Personal Access Token (PAT):");
    if (!pat) return;
    localStorage.setItem("GH_PAT", pat);

    const btn = document.getElementById("saveAllBtn");
    btn.disabled = true;
    btn.innerText = "⏳ Saving...";

    try {
      const getFile = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data.json`, {
        headers: { "Authorization": `Bearer ${pat}`, "Accept": "application/vnd.github+json" }
      });
      if (!getFile.ok) throw new Error("Could not fetch current SHA");
      const fData = await getFile.json();

      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(rawCatalog, null, 2))));
      const putFile = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data.json`, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${pat}`, "Accept": "application/vnd.github+json" },
        body: JSON.stringify({
          message: "⚡ Studio catalog update via Movie Vault Pro",
          content: encoded,
          sha: fData.sha
        })
      });
      if (!putFile.ok) throw new Error("Commit rejected by GitHub");

      try {
        await fetch(WORKER_SYNC_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(rawCatalog)
        });
      } catch (e) {}

      showToast("💾 Saved to GitHub & Cloudflare KV!");
    } catch (e) {
      alert("Save failed: " + e.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "💾 Commit";
    }
  }

  function closeDrawer(e) {
    if (e.target.id === "drawerOverlay") closeDrawerDirect();
  }
  function closeDrawerDirect() {
    document.getElementById("drawerOverlay").style.display = "none";
    renderGrid();
  }

  function escapeHtml(str) {
    return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  window.addEventListener("DOMContentLoaded", loadCatalog);
</script>
</body>
</html>
