<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gofile Stremio Admin</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --quick: #10b981;
      --quick-hover: #059669;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    h1, h2 {
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }

    button {
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s, background-color 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-quick {
      background-color: var(--quick);
    }
    .btn-quick:hover:not(:disabled) {
      background-color: var(--quick-hover);
    }

    .btn-full {
      background-color: var(--primary);
    }
    .btn-full:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: var(--border);
    }

    .status-badge {
      font-size: 14px;
      font-weight: 500;
      margin-left: 8px;
    }

    .config-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    input[type="text"], input[type="password"] {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }

    .log-box {
      background-color: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Gofile to Stremio Admin</h1>
    <p>Trigger synchronized edge updates or manage catalog data directly from your dashboard.</p>
    
    <div class="btn-group">
      <button id="quickSyncBtn" class="btn-quick" onclick="triggerWorkflow('quick_sync.yml', 'Quick Sync')">
        ⚡ Quick Sync (New Uploads)
      </button>

      <button id="fullSyncBtn" class="btn-full" onclick="triggerWorkflow('crawler.yml', 'Full Crawl')">
        📦 Full Sync (Parity Rebuild)
      </button>

      <button class="btn-secondary" onclick="checkLatestWorkflowRun()">
        🔄 Refresh Run Status
      </button>
    </div>

    <div style="margin-top: 14px;">
      <span id="statusLabel" class="status-badge" style="color: var(--text-muted); margin-left: 0;">Idle</span>
    </div>
  </div>

  <div class="card">
    <h2>Activity & Execution Logs</h2>
    <div id="logViewer" class="log-box">Waiting for commands...</div>
  </div>

  <div class="card">
    <h2>Settings</h2>
    <p>Personal Access Token (PAT) requires <code>actions:write</code> permissions to dispatch GitHub Actions workflows.</p>
    <div class="config-section">
      <input type="password" id="patInput" placeholder="GitHub Personal Access Token (ghp_...)" />
      <div style="display: flex; gap: 8px;">
        <button class="btn-secondary" onclick="savePat()">Save Token</button>
        <button class="btn-secondary" style="color: var(--danger);" onclick="clearPat()">Clear Token</button>
      </div>
    </div>
  </div>
</div>

<script>
  const GITHUB_REPO_OWNER = "c238ooking-ops";
  const GITHUB_REPO_NAME = "gofile2stremio";

  function log(msg) {
    const box = document.getElementById("logViewer");
    const ts = new Date().toLocaleTimeString();
    box.textContent += `[${ts}] ${msg}\n`;
    box.scrollTop = box.scrollHeight;
  }

  function getPat() {
    return localStorage.getItem("GH_PAT") || "";
  }

  function savePat() {
    const val = document.getElementById("patInput").value.trim();
    if (val) {
      localStorage.setItem("GH_PAT", val);
      log("GitHub Token saved to local storage.");
      alert("Token saved successfully.");
    }
  }

  function clearPat() {
    localStorage.removeItem("GH_PAT");
    document.getElementById("patInput").value = "";
    log("GitHub Token cleared.");
    alert("Token removed.");
  }

  window.addEventListener("DOMContentLoaded", () => {
    const existing = getPat();
    if (existing) {
      document.getElementById("patInput").value = existing;
      log("Loaded existing GitHub Token from local storage.");
    }
  });

  async function triggerWorkflow(workflowFilename, label) {
    const token = getPat();
    const status = document.getElementById("statusLabel");
    const quickBtn = document.getElementById("quickSyncBtn");
    const fullBtn = document.getElementById("fullSyncBtn");

    if (!token) {
      alert("Please enter and save your GitHub Personal Access Token first.");
      return;
    }

    quickBtn.disabled = true;
    fullBtn.disabled = true;
    status.style.color = "#38bdf8";
    status.innerText = `🚀 Triggering ${label}...`;
    log(`Dispatching workflow: ${workflowFilename} on branch: main`);

    try {
      const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/workflows/${workflowFilename}/dispatches`;
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28"
        },
        body: JSON.stringify({ ref: "main" })
      });

      if (res.status === 204) {
        status.style.color = "#10b981";
        status.innerText = `✅ ${label} dispatched successfully! Execution running...`;
        log(`Workflow ${workflowFilename} successfully triggered (204 No Content).`);
        
        // Auto-poll after a brief delay
        setTimeout(() => checkLatestWorkflowRun(), 5000);
      } else {
        const errorData = await res.json().catch(() => ({}));
        const errMsg = errorData.message || res.statusText;
        status.style.color = "#ef4444";
        status.innerText = `❌ Error: ${errMsg}`;
        log(`Failed dispatching ${label}: HTTP ${res.status} - ${errMsg}`);
      }
    } catch (e) {
      status.style.color = "#ef4444";
      status.innerText = `❌ Request failed: ${e.message}`;
      log(`Network error: ${e.message}`);
    } finally {
      quickBtn.disabled = false;
      fullBtn.disabled = false;
    }
  }

  async function checkLatestWorkflowRun() {
    const token = getPat();
    const status = document.getElementById("statusLabel");

    if (!token) {
      log("Cannot query runs: Missing GitHub token.");
      return;
    }

    log("Fetching latest workflow run status...");
    try {
      const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/runs?per_page=1`;
      const res = await fetch(url, {
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28"
        }
      });

      if (res.ok) {
        const data = await res.json();
        const run = data.workflow_runs?.[0];
        if (run) {
          const runName = run.name;
          const runStatus = run.status;       // queued, in_progress, completed
          const runConclusion = run.conclusion; // success, failure, null
          
          let displayMsg = `[${runName}] Status: ${runStatus}`;
          if (runConclusion) displayMsg += ` (${runConclusion})`;

          status.innerText = displayMsg;
          if (runStatus === "completed" && runConclusion === "success") {
            status.style.color = "#10b981";
          } else if (runStatus === "in_progress" || runStatus === "queued") {
            status.style.color = "#f59e0b";
          } else {
            status.style.color = "#ef4444";
          }
          log(`Latest Run: ${displayMsg} - URL: ${run.html_url}`);
        }
      } else {
        log(`Failed fetching workflow runs: HTTP ${res.status}`);
      }
    } catch (e) {
      log(`Status fetch error: ${e.message}`);
    }
  }
</script>

</body>
</html>
