<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gofile Library & Sync Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --border: #334155; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #f8fafc; margin: 0; padding: 15px; }
    .container { max-width: 1400px; margin: 0 auto; }
    .card { background: var(--panel); border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    input, select, button { padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: white; outline: none; font-size: 14px; }
    input:focus { border-color: var(--accent); }
    button { background: #0284c7; border: none; cursor: pointer; font-weight: 600; transition: 0.15s; }
    button:active { transform: scale(0.97); }
    button.save { background: #16a34a; }
    button.sync { background: #8b5cf6; }
    button.sync:hover { background: #7c3aed; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .table-container { overflow-x: auto; max-height: 72vh; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    th { background: #0b1120; position: sticky; top: 0; z-index: 10; font-size: 12px; text-transform: uppercase; color: #94a3b8; }

    .poster-thumb { width: 44px; height: 64px; object-fit: cover; border-radius: 4px; background: #334155; cursor: pointer; border: 1px solid #475569; display: block; }
    .poster-thumb:hover { border-color: var(--accent); opacity: 0.85; }

    .tag { padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .tag.series { background: #4f46e5; }
    .tag.movie { background: #0284c7; }
    
    .cell-input { width: 100%; background: transparent; border: 1px solid transparent; padding: 6px; color: white; border-radius: 4px; font-size: 13px; }
    .cell-input:focus { background: var(--bg); border-color: var(--accent); }

    .accordion-btn { background: #334155; padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; color: #e2e8f0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .accordion-btn:hover { background: #475569; }
    .sub-table-row { background: #131d31; display: none; }
    .sub-table-row.open { display: table-row; }
    .sub-table { width: 100%; border-collapse: collapse; background: #090e1a; border-radius: 6px; overflow: hidden; margin: 8px 0; }
    .sub-table td { border-bottom: 1px solid #1e293b; padding: 8px 12px; }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 15px; }
    .modal { background: var(--panel); border-radius: 12px; max-width: 440px; width: 100%; padding: 20px; border: 1px solid var(--border); }
    .modal-preview { width: 100%; max-height: 280px; object-fit: contain; border-radius: 6px; margin: 12px 0; background: #000; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h3 style="margin: 0 0 14px 0;">Stremio Gofile Library & Sync Manager</h3>
    <div class="controls">
      <input type="password" id="pat" placeholder="GitHub Token (ghp_...)" style="flex: 2; min-width: 200px;">
      <input type="text" id="repo" placeholder="owner/repo" style="flex: 1; min-width: 140px;">
      <button onclick="loadCatalog()">Load</button>
      <button class="save" onclick="saveCatalog()">Commit</button>
      <button id="syncBtn" class="sync" onclick="triggerGofileSync()">Sync Gofile</button>
      <span id="status" style="font-size: 13px; color: #94a3b8;"></span>
    </div>
    <div class="controls" style="margin-bottom: 0;">
      <input type="text" id="search" placeholder="Search titles, IMDb IDs, filenames..." oninput="filterTable()" style="flex: 1;">
      <select id="typeFilter" onchange="filterTable()">
        <option value="all">All Types</option>
        <option value="movie">Movies</option>
        <option value="series">Series</option>
      </select>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 50px;">Poster</th>
          <th style="width: 70px;">Type</th>
          <th>Catalog Title</th>
          <th style="width: 140px;">IMDb ID</th>
          <th style="width: 110px;">Edition</th>
          <th style="width: 140px;">Episodes / Info</th>
          <th>File Source</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- POSTER EDIT MODAL -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h4 style="margin: 0 0 10px 0;">Change Poster Artwork</h4>
    <img id="modalImgPreview" class="modal-preview" src="">
    <input type="text" id="modalImgUrl" placeholder="Paste image URL (.jpg, .png)" style="width: 100%; margin-bottom: 10px;" oninput="updateModalPreview(this.value)">
    <div style="display: flex; gap: 8px; justify-content: flex-end;">
      <button style="background: #334155;" onclick="closeModal()">Cancel</button>
      <button style="background: #eab308; color: black;" onclick="fetchAutoPoster()">Auto Cinemeta</button>
      <button class="save" onclick="applyPosterChange()">Apply</button>
    </div>
  </div>
</div>

<script>
  let rawCatalogData = [];
  let fileSha = "";
  let modalTarget = { type: null, id: null };

  document.getElementById("pat").value = localStorage.getItem("gh_pat") || "";
  document.getElementById("repo").value = localStorage.getItem("gh_repo") || "";

  async function loadCatalog() {
    const pat = document.getElementById("pat").value.trim();
    const repo = document.getElementById("repo").value.trim();
    const status = document.getElementById("status");

    if (!pat || !repo) return alert("Provide your GitHub PAT and repo name.");
    localStorage.setItem("gh_pat", pat);
    localStorage.setItem("gh_repo", repo);

    status.textContent = "Loading catalog...";
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
        headers: { Authorization: `token ${pat}`, Accept: "application/vnd.github.v3+json" }
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      fileSha = data.sha;
      rawCatalogData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      renderGroupedTable();
      status.textContent = `Loaded ${rawCatalogData.length} files.`;
    } catch (err) {
      status.textContent = "Error.";
      alert(err.message);
    }
  }

  function getGroupedData() {
    const movies = [];
    const seriesMap = {};

    rawCatalogData.forEach((item, index) => {
      item.__index = index;
      if (item.type === 'series') {
        const groupKey = item.imdb_id || item.title;
        if (!seriesMap[groupKey]) {
          seriesMap[groupKey] = {
            key: groupKey,
            title: item.title,
            imdb_id: item.imdb_id,
            poster: item.poster,
            episodes: []
          };
        }
        seriesMap[groupKey].episodes.push(item);
      } else {
        movies.push(item);
      }
    });

    Object.values(seriesMap).forEach(s => {
      s.episodes.sort((a, b) => (a.season - b.season) || (a.episode - b.episode));
    });

    return { movies, series: Object.values(seriesMap) };
  }

  function renderGroupedTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    const { movies, series } = getGroupedData();

    // 1. Render Series (Grouped)
    series.forEach((s, idx) => {
      const sRow = document.createElement("tr");
      sRow.className = "group-row";
      sRow.id = `series-row-${idx}`;
      sRow.setAttribute("data-type", "series");
      sRow.setAttribute("data-search", `${s.title} ${s.imdb_id}`.toLowerCase());

      const posterSrc = s.poster || "https://gofile.io/dist/img/logo-small.png";

      sRow.innerHTML = `
        <td><img class="poster-thumb" src="${posterSrc}" alt="" onclick="openPosterModal('series', '${s.key}')"></td>
        <td><span class="tag series">Series</span></td>
        <td><input class="cell-input" value="${s.title || ''}" onchange="updateSeriesGroup('${s.key}', 'title', this.value)"></td>
        <td><input class="cell-input" style="font-family: monospace;" value="${s.imdb_id || ''}" onchange="updateSeriesImdb('${s.key}', this.value)"></td>
        <td><span style="color: #64748b; font-size: 11px;">(Per-Ep)</span></td>
        <td>
          <button class="accordion-btn" onclick="toggleAccordion('acc-${idx}')">
            📁 ${s.episodes.length} Episodes ▾
          </button>
        </td>
        <td style="color: #94a3b8; font-size: 11px;">Multi-File Directory</td>
      `;
      tbody.appendChild(sRow);

      // Accordion Sub-row containing nested episodes
      const subRow = document.createElement("tr");
      subRow.className = "sub-table-row";
      subRow.id = `acc-${idx}`;
      let epRowsHtml = s.episodes.map(ep => `
        <tr>
          <td style="width: 90px; color: #38bdf8; font-weight: 600;">S${ep.season} E${ep.episode}</td>
          <td><input class="cell-input" value="${ep.edition || ''}" placeholder="Edition (e.g. IMAX)" onchange="updateSingleFile(${ep.__index}, 'edition', this.value)"></td>
          <td style="color: #64748b; font-size: 11px; max-width: 400px; word-break: break-all;">${ep.name || ''}</td>
        </tr>
      `).join("");

      subRow.innerHTML = `
        <td colspan="7" style="padding: 4px 15px 15px 15px;">
          <table class="sub-table">
            <thead>
              <tr style="background: #111827; color: #94a3b8; font-size: 11px;">
                <th>Season / Ep</th>
                <th>Edition</th>
                <th>Original File</th>
              </tr>
            </thead>
            <tbody>${epRowsHtml}</tbody>
          </table>
        </td>
      `;
      tbody.appendChild(subRow);
    });

    // 2. Render Movies
    movies.forEach(m => {
      const mRow = document.createElement("tr");
      mRow.className = "group-row";
      mRow.id = `movie-row-${m.__index}`;
      mRow.setAttribute("data-type", "movie");
      mRow.setAttribute("data-search", `${m.title} ${m.imdb_id} ${m.name}`.toLowerCase());

      const posterSrc = m.poster || "https://gofile.io/dist/img/logo-small.png";

      mRow.innerHTML = `
        <td><img class="poster-thumb" src="${posterSrc}" alt="" onclick="openPosterModal('movie', ${m.__index})"></td>
        <td><span class="tag movie">Movie</span></td>
        <td><input class="cell-input" value="${m.title || ''}" onchange="updateSingleFile(${m.__index}, 'title', this.value)"></td>
        <td><input class="cell-input" style="font-family: monospace;" value="${m.imdb_id || ''}" onchange="updateMovieImdb(${m.__index}, this.value)"></td>
        <td><input class="cell-input" value="${m.edition || ''}" placeholder="Edition" onchange="updateSingleFile(${m.__index}, 'edition', this.value)"></td>
        <td style="color: #64748b;">Single Video</td>
        <td style="color: #64748b; font-size: 11px; max-width: 320px; word-break: break-all;">${m.name || ''}</td>
      `;
      tbody.appendChild(mRow);
    });
  }

  function toggleAccordion(id) {
    const el = document.getElementById(id);
    el.classList.toggle("open");
  }

  function updateSingleFile(index, key, val) {
    rawCatalogData[index][key] = val;
  }

  function updateMovieImdb(index, newImdb) {
    newImdb = newImdb.trim();
    rawCatalogData[index].imdb_id = newImdb;
    rawCatalogData[index].stream_id = newImdb;
  }

  function updateSeriesGroup(groupKey, key, val) {
    rawCatalogData.forEach(item => {
      if (item.type === 'series' && (item.imdb_id === groupKey || item.title === groupKey)) {
        item[key] = val;
      }
    });
  }

  function updateSeriesImdb(groupKey, newImdb) {
    newImdb = newImdb.trim();
    rawCatalogData.forEach(item => {
      if (item.type === 'series' && (item.imdb_id === groupKey || item.title === groupKey)) {
        item.imdb_id = newImdb;
        item.stream_id = `${newImdb}:${item.season}:${item.episode}`;
      }
    });
  }

  // --- POSTER MODAL LOGIC ---
  function openPosterModal(type, target) {
    modalTarget = { type, target };
    let currentUrl = "";

    if (type === 'movie') {
      currentUrl = rawCatalogData[target].poster || "";
    } else {
      const firstEp = rawCatalogData.find(i => i.type === 'series' && (i.imdb_id === target || i.title === target));
      currentUrl = firstEp?.poster || "";
    }

    document.getElementById("modalImgUrl").value = currentUrl;
    document.getElementById("modalImgPreview").src = currentUrl || "https://gofile.io/dist/img/logo-small.png";
    document.getElementById("modalBackdrop").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("modalBackdrop").style.display = "none";
  }

  function updateModalPreview(url) {
    document.getElementById("modalImgPreview").src = url;
  }

  async function fetchAutoPoster() {
    let imdbId = "";
    let mediaType = modalTarget.type;

    if (mediaType === 'movie') {
      imdbId = rawCatalogData[modalTarget.target].imdb_id;
    } else {
      const firstEp = rawCatalogData.find(i => i.type === 'series' && (i.imdb_id === modalTarget.target || i.title === modalTarget.target));
      imdbId = firstEp?.imdb_id;
    }

    if (!imdbId || !imdbId.startsWith("tt")) return alert("Requires valid IMDb ID (tt...)");

    try {
      const res = await fetch(`https://v3-cinemeta.strem.io/meta/${mediaType}/${imdbId}.json`);
      const data = await res.json();
      if (data?.meta?.poster) {
        document.getElementById("modalImgUrl").value = data.meta.poster;
        updateModalPreview(data.meta.poster);
      } else {
        alert("No official poster found.");
      }
    } catch {
      alert("Cinemeta lookup timed out.");
    }
  }

  function applyPosterChange() {
    const newUrl = document.getElementById("modalImgUrl").value.trim();
    if (modalTarget.type === 'movie') {
      rawCatalogData[modalTarget.target].poster = newUrl;
    } else {
      rawCatalogData.forEach(item => {
        if (item.type === 'series' && (item.imdb_id === modalTarget.target || item.title === modalTarget.target)) {
          item.poster = newUrl;
        }
      });
    }
    closeModal();
    renderGroupedTable();
  }

  // --- GOFILE SYNC ACTIONS TRIGGER ---
  async function triggerGofileSync() {
    const pat = document.getElementById("pat").value.trim();
    const repo = document.getElementById("repo").value.trim();
    const status = document.getElementById("status");
    const syncBtn = document.getElementById("syncBtn");

    if (!pat || !repo) return alert("Provide token and repo name first.");

    syncBtn.disabled = true;
    status.textContent = "Triggering crawler...";

    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/update_catalog.yml/dispatches`, {
        method: "POST",
        headers: {
          Authorization: `token ${pat}`,
          Accept: "application/vnd.github.v3+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ ref: "main" })
      });

      if (!res.ok) throw new Error(await res.text());

      status.textContent = "Crawler running...";
      pollWorkflowRun(pat, repo);
    } catch (err) {
      status.textContent = "Sync trigger failed.";
      syncBtn.disabled = false;
      alert(`Could not start workflow: ${err.message}`);
    }
  }

  async function pollWorkflowRun(pat, repo) {
    const status = document.getElementById("status");
    const syncBtn = document.getElementById("syncBtn");

    let attempts = 0;
    const interval = setInterval(async () => {
      attempts++;
      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=1`, {
          headers: { Authorization: `token ${pat}`, Accept: "application/vnd.github.v3+json" }
        });
        const data = await res.json();
        const latestRun = data.workflow_runs?.[0];

        if (latestRun) {
          if (latestRun.status === "completed") {
            clearInterval(interval);
            syncBtn.disabled = false;
            status.textContent = `Sync completed (${latestRun.conclusion})! Reloading...`;
            setTimeout(loadCatalog, 1500);
            return;
          } else {
            status.textContent = `Crawler running (${latestRun.status})...`;
          }
        }
      } catch (e) {}

      if (attempts > 30) {
        clearInterval(interval);
        syncBtn.disabled = false;
        status.textContent = "Crawler still running. Check Actions tab.";
      }
    }, 6000);
  }

  function filterTable() {
    const q = document.getElementById("search").value.toLowerCase();
    const type = document.getElementById("typeFilter").value;

    document.querySelectorAll(".group-row").forEach(row => {
      const rowType = row.getAttribute("data-type");
      const rowSearch = row.getAttribute("data-search");

      const matchesSearch = rowSearch.includes(q);
      const matchesType = type === "all" || rowType === type;

      row.style.display = matchesSearch && matchesType ? "" : "none";
    });
  }

  async function saveCatalog() {
    const pat = document.getElementById("pat").value.trim();
    const repo = document.getElementById("repo").value.trim();
    const status = document.getElementById("status");

    if (!fileSha) return alert("Load the catalog first!");
    status.textContent = "Committing to GitHub...";

    const cleanOutput = rawCatalogData.map(item => {
      const copy = { ...item };
      delete copy.__index;
      return copy;
    });

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(cleanOutput, null, 2))));
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
        method: "PUT",
        headers: { Authorization: `token ${pat}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "Update library metadata & posters via Web Dashboard [skip ci]",
          content: content,
          sha: fileSha
        })
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      fileSha = data.content.sha;
      status.textContent = "Saved!";
      alert("Changes committed to data.json successfully!");
    } catch (err) {
      status.textContent = "Save failed.";
      alert(err.message);
    }
  }
</script>
</body>
</html>
