<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Vault Pro</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141419;
      --border: #23232c;
      --border-focus: #4f46e5;
      --text: #ffffff;
      --text-muted: #8b8b9e;
      --quick: #10b981;
      --primary: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 32px;
      min-height: 100vh;
    }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title span {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-quick { background-color: var(--quick); }
    .btn-quick:hover:not(:disabled) { background-color: #059669; }

    .btn-full { background-color: var(--primary); }
    .btn-full:hover:not(:disabled) { background-color: #2563eb; }

    .btn-auto {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
    }
    .btn-auto:hover:not(:disabled) {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
    }

    .btn-ghost {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover:not(:disabled) {
      color: var(--text);
      border-color: #3f3f50;
    }

    .live-pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--warning);
      margin-right: 6px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.3; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.2); }
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
    }
    .search-box:focus {
      outline: 1px solid var(--border-focus);
    }

    .filter-select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
    }

    .status-indicator {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    .vault-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .vault-card:hover {
      transform: translateY(-4px);
      border-color: #3b3b4f;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: #1a1a22;
      overflow: hidden;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-year {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .badge-count {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(16, 185, 129, 0.85);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
    }

    .badge-series {
      background: rgba(59, 130, 246, 0.85);
    }

    .card-meta {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-dialog {
      background: #15151c;
      border: 1px solid #2b2b3b;
      border-radius: 12px;
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .editor-section {
      display: none;
      background: #101016;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.15s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .field-group input, .field-group select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    .field-group input:focus {
      outline: 1px solid var(--border-focus);
    }

    .stream-item {
      background: #1a1a24;
      border: 1px solid #262634;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stream-row-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stream-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .stream-fname {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    .stream-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stream-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .stream-actions a, .stream-actions button {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 4px;
      text-decoration: none;
    }

    .stream-edit-row {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      align-items: flex-end;
    }

    .footer-bar {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="brand-title">
      🎬 <span>Movie Vault Pro</span>
    </div>
    <div class="nav-actions">
      <button class="btn-ghost" onclick="loadCatalog()">🔄 Refresh</button>
      <button class="btn-quick" id="btnQuickSync" onclick="triggerWorkflow('quick_sync.yml', 'Quick Sync')">⚡ Quick Sync</button>
      <button class="btn-full" id="btnFullSync" onclick="triggerWorkflow('crawler.yml', 'Full Crawl')">📦 Full Sync</button>
      <button class="btn-ghost" onclick="checkRunStatus(true)">Status</button>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchBox" class="search-box" placeholder="Search catalog by title, year, IMDb ID, or filename..." oninput="renderVaultGrid()" />
    <select id="typeFilter" class="filter-select" onchange="renderVaultGrid()">
      <option value="all">All Content</option>
      <option value="movie">Movies Only</option>
      <option value="series">Series & Franchises</option>
    </select>
    <div class="status-indicator" id="statusText">Awaiting catalog load...</div>
  </div>

  <div class="poster-grid" id="vaultGrid"></div>

  <div class="modal-backdrop" id="streamModal" onclick="closeModal(event)">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Streams</h3>
        <div style="display: flex; gap: 8px;">
          <button class="btn-ghost" id="toggleEditBtn" onclick="toggleEditMode()">⚙️ Edit Metadata</button>
          <button class="btn-ghost" style="padding: 4px 8px;" onclick="document.getElementById('streamModal').style.display='none'">✕</button>
        </div>
      </div>
      <div class="modal-body">
        
        <div class="editor-section" id="editorSection">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
            <h4 style="font-size: 13px; color: #f8fafc;">Group Metadata</h4>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="btn-ghost" style="padding: 5px 10px;" onclick="autoConsolidateSpecials()">🎬 Consolidate Specials</button>
              <button class="btn-auto" id="autoFetchBtn" style="padding: 5px 10px;" onclick="autoFetchMetadata()">✨ Auto IMDb</button>
              <button class="btn-quick" id="saveMetaBtn" style="padding: 5px 10px;" onclick="saveGroupMetadata()">💾 Save Changes</button>
            </div>
          </div>
          
          <div class="editor-grid">
            <div class="field-group">
              <label>Canonical Title</label>
              <input type="text" id="editTitle" />
            </div>

            <div class="field-group">
              <label>IMDb ID / Anchor</label>
              <input type="text" id="editImdbId" placeholder="tt1234567 or gf:..." />
            </div>

            <div class="field-group">
              <label>Media Type</label>
              <select id="editType">
                <option value="movie">Movie</option>
                <option value="series">Series</option>
              </select>
            </div>

            <div class="field-group">
              <label>Poster Image URL</label>
              <input type="text" id="editPoster" placeholder="https://..." />
            </div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h4 style="font-size: 13px; color: #f8fafc;">Available Streams (<span id="modalStreamCount">0</span>)</h4>
        </div>
        <div id="modalStreamsList" style="display: flex; flex-direction: column; gap: 10px;"></div>

      </div>
    </div>
  </div>

  <div class="footer-bar">
    <span>GitHub PAT:</span>
    <input type="password" id="patInput" class="filter-select" placeholder="ghp_..." style="padding: 6px 10px; width: 220px;" />
    <button class="btn-ghost" onclick="savePat()">Save</button>
    <span style="margin-left: auto;" id="vaultStats">0 Titles | 0 Streams</span>
  </div>

  <script>
    const GITHUB_REPO_OWNER = "c238ooking-ops";
    const GITHUB_REPO_NAME = "gofile2stremio";
    const WORKER_CATALOG_URL = "https://gofile2stremio.c238ooking.workers.dev/catalog";
    const WORKER_SYNC_URL = "https://gofile2stremio.c238ooking.workers.dev/sync";
    const GITHUB_RAW = `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/main/data.json`;

    let rawStreams = [];
    let groupedCatalog = [];
    let currentActiveGroup = null;
    let isEditMode = false;
    let livePollInterval = null;

    function savePat() {
      const p = document.getElementById("patInput").value.trim();
      if (p) {
        localStorage.setItem("GH_PAT", p);
        alert("GitHub Token saved!");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("GH_PAT");
      if (saved) document.getElementById("patInput").value = saved;
      loadCatalog();
    });

    async function loadCatalog() {
      const status = document.getElementById("statusText");
      status.innerHTML = `<span class="live-pulse"></span> Loading catalog...`;
      status.style.color = "#38bdf8";

      try {
        let res = await fetch(`${GITHUB_RAW}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) res = await fetch(WORKER_CATALOG_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("Could not load data.json or worker catalog.");

        const data = await res.json();
        rawStreams = Array.isArray(data) ? data : (data.metas || data.streams || Object.values(data));

        aggregateCatalog();
        renderVaultGrid();

        status.innerHTML = `Ready (${groupedCatalog.length} titles active)`;
        status.style.color = "#10b981";
      } catch (e) {
        status.innerHTML = `Fetch error: ${e.message}`;
        status.style.color = "#ef4444";
      }
    }

    function aggregateCatalog() {
      const map = new Map();

      rawStreams.forEach(item => {
        const key = item.imdb_id || item.title;
        if (!map.has(key)) {
          let year = item.year || "";
          if (!year && item.title) {
            const ym = item.title.match(/\b(19\d\d|20\d\d)\b/);
            if (ym) year = ym[1];
          }

          map.set(key, {
            id: key,
            title: item.title || item.name,
            type: item.type || "movie",
            poster: item.poster && !item.poster.includes("logo-small") ? item.poster : "",
            year: year,
            streams: []
          });
        }

        const entry = map.get(key);
        if (!entry.poster && item.poster && !item.poster.includes("logo-small")) {
          entry.poster = item.poster;
        }
        entry.streams.push(item);
      });

      groupedCatalog = Array.from(map.values());
      groupedCatalog.sort((a, b) => a.title.localeCompare(b.title));
      document.getElementById("vaultStats").innerText = `${groupedCatalog.length} Titles | ${rawStreams.length} Streams`;
    }

    function renderVaultGrid() {
      const q = document.getElementById("searchBox").value.toLowerCase().trim();
      const filterType = document.getElementById("typeFilter").value;
      const grid = document.getElementById("vaultGrid");
      grid.innerHTML = "";

      const filtered = groupedCatalog.filter(group => {
        const matchesType = (filterType === "all") || (group.type === filterType);
        const matchesQuery = !q ||
          group.title.toLowerCase().includes(q) ||
          group.id.toLowerCase().includes(q) ||
          group.streams.some(s => s.name && s.name.toLowerCase().includes(q));
        return matchesType && matchesQuery;
      });

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "vault-card";
        card.onclick = () => openGroupModal(item);

        const isSeries = item.type === "series" || item.streams.length > 1;
        const countBadge = isSeries
          ? `<span class="badge-count badge-series">${item.streams.length} Eps</span>`
          : (item.streams[0]?.quality ? `<span class="badge-count">${item.streams[0].quality}</span>` : "");

        const fallbackPoster = `https://placehold.co/300x450/141419/8b8b9e?text=${encodeURIComponent(item.title)}`;
        const posterSrc = item.poster || fallbackPoster;

        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${posterSrc}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.src='${fallbackPoster}'" />
            ${item.year ? `<span class="badge-year">${item.year}</span>` : ""}
            ${countBadge}
          </div>
          <div class="card-meta">
            <div class="card-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
            <div class="card-sub">
              <span>${item.type.toUpperCase()}</span>
              <span>★</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openGroupModal(group) {
      currentActiveGroup = group;
      isEditMode = false;

      document.getElementById("editorSection").style.display = "none";
      document.getElementById("toggleEditBtn").innerText = "⚙️ Edit Metadata";

      document.getElementById("modalTitle").innerText = group.title;
      document.getElementById("editTitle").value = group.title || "";
      document.getElementById("editImdbId").value = group.id || "";
      document.getElementById("editType").value = group.type || "movie";
      document.getElementById("editPoster").value = group.poster || "";
      document.getElementById("modalStreamCount").innerText = group.streams.length;

      renderModalStreamRows(group);
      document.getElementById("streamModal").style.display = "flex";
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const editor = document.getElementById("editorSection");
      const btn = document.getElementById("toggleEditBtn");
      const subEdits = document.querySelectorAll(".stream-edit-row");

      if (isEditMode) {
        editor.style.display = "flex";
        btn.innerText = "✕ Close Editor";
        subEdits.forEach(el => el.style.display = "grid");
      } else {
        editor.style.display = "none";
        btn.innerText = "⚙️ Edit Metadata";
        subEdits.forEach(el => el.style.display = "none");
      }
    }

    function renderModalStreamRows(group) {
      const container = document.getElementById("modalStreamsList");
      container.innerHTML = "";

      const streams = [...group.streams].sort((a, b) => (a.season || 0) - (b.season || 0) || (a.episode || 0) - (b.episode || 0));

      streams.forEach(s => {
        const div = document.createElement("div");
        div.className = "stream-item";

        const label = s.season !== undefined && s.episode !== undefined 
          ? `S${String(s.season).padStart(2, '0')}E${String(s.episode).padStart(2, '0')}`
          : (s.edition || "Main Feature");

        let moveOptions = groupedCatalog.map(g => `<option value="${escapeHtml(g.id)}" ${g.id === group.id ? 'selected' : ''}>${escapeHtml(g.title)}</option>`).join("");

        div.innerHTML = `
          <div class="stream-row-main">
            <div class="stream-info">
              <div class="stream-fname">${escapeHtml(label)} - ${escapeHtml(s.name || group.title)}</div>
              <div class="stream-desc">${escapeHtml(s.description || s.size || '')}</div>
            </div>
            <div class="stream-actions">
              <a href="${escapeHtml(s.link)}" target="_blank" class="btn-quick">Stream</a>
              <button class="btn-ghost" onclick="copyLink('${escapeHtml(s.link)}')">Copy</button>
            </div>
          </div>

          <div class="stream-edit-row" style="display: ${isEditMode ? 'grid' : 'none'};">
            <div class="field-group">
              <label>Move to Entry</label>
              <select onchange="moveStreamToGroup('${s.file_id}', this.value)">
                ${moveOptions}
              </select>
            </div>
            <div class="field-group">
              <label>Season</label>
              <input type="number" value="${s.season ?? 1}" onchange="updateStreamProp('${s.file_id}', 'season', parseInt(this.value))" />
            </div>
            <div class="field-group">
              <label>Episode</label>
              <input type="number" value="${s.episode ?? 1}" onchange="updateStreamProp('${s.file_id}', 'episode', parseInt(this.value))" />
            </div>
            <div class="field-group">
              <label>Quality</label>
              <input type="text" value="${escapeHtml(s.quality || '1080P')}" onchange="updateStreamProp('${s.file_id}', 'quality', this.value)" />
            </div>
            <div class="field-group">
              <label>Tag / Edition</label>
              <input type="text" value="${escapeHtml(s.edition || '')}" onchange="updateStreamProp('${s.file_id}', 'edition', this.value)" />
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function moveStreamToGroup(fid, targetGroupId) {
      const streamIndex = rawStreams.findIndex(s => s.file_id === fid);
      if (streamIndex === -1) return;

      const targetGroup = groupedCatalog.find(g => g.id === targetGroupId);
      if (!targetGroup) return;

      const stream = rawStreams[streamIndex];
      stream.title = targetGroup.title;
      stream.imdb_id = targetGroup.id;
      stream.type = targetGroup.type;
      stream.poster = targetGroup.poster;

      if (targetGroup.type === "series") {
        stream.season = 1;
        stream.episode = targetGroup.streams.length + 1;
        stream.stream_id = `${targetGroup.id}:${stream.season}:${stream.episode}`;
        stream.stream_ids = [stream.stream_id];
      } else {
        delete stream.season;
        delete stream.episode;
        stream.stream_id = targetGroup.id;
        stream.stream_ids = [targetGroup.id];
      }

      aggregateCatalog();
      const updated = groupedCatalog.find(g => g.id === currentActiveGroup.id);
      if (updated) {
        currentActiveGroup = updated;
        renderModalStreamRows(updated);
      } else {
        document.getElementById("streamModal").style.display = "none";
      }
      renderVaultGrid();
    }

    function autoConsolidateSpecials() {
      if (!currentActiveGroup) return;

      let specialIndex = 1;
      let consolidatedCount = 0;

      currentActiveGroup.streams.forEach(s => {
        const lower = (s.name || "").toLowerCase();
        if (
          lower.includes("special") ||
          lower.includes("extra") ||
          lower.includes("bonus") ||
          lower.includes("featurette") ||
          lower.includes("interview") ||
          lower.includes("deleted")
        ) {
          s.season = 0;
          s.episode = specialIndex++;
          s.edition = (s.edition ? s.edition + " | " : "") + "Special";
          s.stream_id = `${s.imdb_id}:0:${s.episode}`;
          s.stream_ids = [s.stream_id];
          consolidatedCount++;
        }
      });

      if (consolidatedCount > 0) {
        alert(`Consolidated ${consolidatedCount} files into Season 0.`);
        renderModalStreamRows(currentActiveGroup);
      } else {
        alert("No special or extra video tags found.");
      }
    }

    function updateStreamProp(fid, prop, value) {
      const stream = rawStreams.find(s => s.file_id === fid);
      if (stream) {
        stream[prop] = value;
        if (stream.type === "series" && (prop === "season" || prop === "episode")) {
          stream.stream_id = `${stream.imdb_id}:${stream.season}:${stream.episode}`;
          stream.stream_ids = [stream.stream_id];
        }
      }
    }

    // Git Trees API implementation (Handles large files > 1MB reliably)
    async function saveGroupMetadata() {
      if (!currentActiveGroup) return;
      const pat = localStorage.getItem("GH_PAT");
      if (!pat) return alert("GitHub Token is required. Save your PAT at the bottom of the page.");

      const saveBtn = document.getElementById("saveMetaBtn");
      saveBtn.disabled = true;
      saveBtn.innerText = "⏳ Saving...";

      const newTitle = document.getElementById("editTitle").value.trim();
      const newImdbId = document.getElementById("editImdbId").value.trim();
      const newType = document.getElementById("editType").value;
      const newPoster = document.getElementById("editPoster").value.trim();

      currentActiveGroup.title = newTitle;
      currentActiveGroup.id = newImdbId;
      currentActiveGroup.type = newType;
      currentActiveGroup.poster = newPoster;

      currentActiveGroup.streams.forEach(s => {
        s.title = newTitle;
        s.imdb_id = newImdbId;
        s.type = newType;
        s.poster = newPoster;
        if (newType === "series") {
          s.stream_id = `${newImdbId}:${s.season || 1}:${s.episode || 1}`;
          s.stream_ids = [s.stream_id];
        } else {
          s.stream_id = newImdbId;
          s.stream_ids = [newImdbId];
        }
      });

      const status = document.getElementById("statusText");
      status.innerHTML = `<span class="live-pulse"></span> Writing tree commit to GitHub...`;
      status.style.color = "#38bdf8";

      const headers = {
        "Authorization": `Bearer ${pat}`,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      };

      try {
        const repoBase = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}`;

        // 1. Get latest commit SHA on main
        const refRes = await fetch(`${repoBase}/git/ref/heads/main`, { headers });
        if (!refRes.ok) throw new Error(`Fetch ref failed: ${refRes.statusText}`);
        const refData = await refRes.json();
        const latestCommitSha = refData.object.sha;

        // 2. Get tree SHA of latest commit
        const commitRes = await fetch(`${repoBase}/git/commits/${latestCommitSha}`, { headers });
        const commitData = await commitRes.json();
        const baseTreeSha = commitData.tree.sha;

        // 3. Create blob for updated data.json
        const blobRes = await fetch(`${repoBase}/git/blobs`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            content: JSON.stringify(rawStreams, null, 2),
            encoding: "utf-8"
          })
        });
        if (!blobRes.ok) throw new Error(`Blob creation failed: ${blobRes.statusText}`);
        const blobData = await blobRes.json();

        // 4. Create new tree pointing to the new blob
        const treeRes = await fetch(`${repoBase}/git/trees`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            base_tree: baseTreeSha,
            tree: [{
              path: "data.json",
              mode: "100644",
              type: "blob",
              sha: blobData.sha
            }]
          })
        });
        if (!treeRes.ok) throw new Error(`Tree creation failed: ${treeRes.statusText}`);
        const treeData = await treeRes.json();

        // 5. Create new commit
        const newCommitRes = await fetch(`${repoBase}/git/commits`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            message: `✏️ Update metadata: ${newTitle}`,
            tree: treeData.sha,
            parents: [latestCommitSha]
          })
        });
        if (!newCommitRes.ok) throw new Error(`Commit creation failed: ${newCommitRes.statusText}`);
        const newCommitData = await newCommitRes.json();

        // 6. Update main branch reference to new commit
        const updateRefRes = await fetch(`${repoBase}/git/refs/heads/main`, {
          method: "PATCH",
          headers,
          body: JSON.stringify({
            sha: newCommitData.sha,
            force: false
          })
        });
        if (!updateRefRes.ok) throw new Error(`Ref update failed: ${updateRefRes.statusText}`);

        // 7. Sync directly to Cloudflare Worker KV
        try {
          await fetch(WORKER_SYNC_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(rawStreams)
          });
        } catch (e) {}

        status.innerHTML = `✅ Saved to GitHub (${newCommitData.sha.substring(0, 7)}) & KV!`;
        status.style.color = "#10b981";
        alert("Metadata successfully committed to GitHub and synced with Cloudflare KV!");
        document.getElementById("streamModal").style.display = "none";
        aggregateCatalog();
        renderVaultGrid();
      } catch (err) {
        status.innerHTML = `Save error: ${err.message}`;
        status.style.color = "#ef4444";
        alert(`Failed to save metadata: ${err.message}`);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "💾 Save Changes";
      }
    }

    function cleanQueryName(raw) {
      let base = raw.replace(/\.[^/.]+$/, "");
      base = base.replace(/^@[\w\.\-]+(?:\s*-\s*|\s+)/i, "");
      base = base.replace(/^\d{1,3}\s*[\.\-]+\s*(?!\d*x\d+)/i, "");
      base = base.replace(/\[.*?\]/g, " ");
      base = base.replace(/\b(19\d\d|20\d\d)\b.*$/i, "");
      base = base.replace(/[-_.]+/g, " ");
      base = base.replace(/\b(open\s*matte|imax|web\s*dl|webrip|bluray|dvdrip|1080p|720p|4k|hevc|x264|x265|hindi|dual\s*audio|remux)\b.*$/i, "");
      return base.trim();
    }

    async function autoFetchMetadata() {
      const btn = document.getElementById("autoFetchBtn");
      const imdbInput = document.getElementById("editImdbId");
      const titleInput = document.getElementById("editTitle");
      const typeSelect = document.getElementById("editType");
      const posterInput = document.getElementById("editPoster");

      let imdbId = imdbInput.value.trim();

      // If no IMDb ID is provided, prompt or extract from input
      if (!imdbId.startsWith("tt")) {
        const promptVal = prompt("Enter IMDb ID (e.g. tt0111161) or leave blank to search by title:", imdbId);
        if (promptVal !== null) {
          imdbId = promptVal.trim();
        }
      }

      btn.disabled = true;
      btn.innerText = "🔍 Fetching...";

      try {
        // CASE 1: Fetch directly by IMDb ID (Cinemeta - 100% reliable, zero CORS errors)
        if (imdbId.startsWith("tt")) {
          let type = typeSelect.value || "movie";
          let res = await fetch(`https://v3-cinemeta.strem.io/meta/${type}/${imdbId}.json`);
          let data = await res.json();

          // Fallback check: if requested as movie but it's a series (or vice versa)
          if (!data || !data.meta) {
            type = type === "movie" ? "series" : "movie";
            res = await fetch(`https://v3-cinemeta.strem.io/meta/${type}/${imdbId}.json`);
            data = await res.json();
          }

          if (data && data.meta) {
            const meta = data.meta;
            imdbInput.value = meta.imdb_id || imdbId;
            titleInput.value = meta.name || titleInput.value;
            typeSelect.value = meta.type || type;
            if (meta.poster) posterInput.value = meta.poster;

            alert(`✅ Metadata & Poster Loaded!\nTitle: ${meta.name}\nType: ${meta.type}\nYear: ${meta.year || 'N/A'}`);
            return;
          }
        }

        // CASE 2: Search by title if no valid tt ID is given
        const queryTitle = cleanQueryName(titleInput.value.trim() || currentActiveGroup?.title || "");
        if (!queryTitle) {
          alert("Please enter a Title or IMDb ID (tt...) to search.");
          return;
        }

        // Use Cinemeta search catalog (native open CORS)
        const searchRes = await fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${encodeURIComponent(queryTitle)}.json`);
        const searchData = await searchRes.json();
        let match = searchData?.metas?.[0];

        // If not found in movies, check series catalog
        if (!match) {
          const seriesRes = await fetch(`https://v3-cinemeta.strem.io/catalog/series/top/search=${encodeURIComponent(queryTitle)}.json`);
          const seriesData = await seriesRes.json();
          match = seriesData?.metas?.[0];
        }

        if (match) {
          imdbInput.value = match.imdb_id || match.id;
          titleInput.value = match.name;
          typeSelect.value = match.type || "movie";
          if (match.poster) posterInput.value = match.poster;

          alert(`✅ Found Match via Cinemeta!\nTitle: ${match.name}\nID: ${match.imdb_id || match.id}`);
        } else {
          alert(`No matches found for "${queryTitle}". Please paste the IMDb ID (tt...) directly into the IMDb field and click the button again.`);
        }
      } catch (err) {
        alert(`Fetch notice: ${err.message}. Enter the IMDb ID manually (e.g. tt1234567) and retry.`);
      } finally {
        btn.disabled = false;
        btn.innerText = "✨ Auto IMDb";
      }
    }

    function closeModal(e) {
      if (e.target.id === "streamModal") {
        document.getElementById("streamModal").style.display = "none";
      }
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => alert("Stream URL copied!"));
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Trigger workflow with real-time feedback
    async function triggerWorkflow(file, name) {
      const pat = localStorage.getItem("GH_PAT");
      const status = document.getElementById("statusText");
      if (!pat) return alert("Enter and save your GitHub Personal Access Token below.");

      const btnQuick = document.getElementById("btnQuickSync");
      const btnFull = document.getElementById("btnFullSync");
      btnQuick.disabled = true;
      btnFull.disabled = true;

      status.innerHTML = `<span class="live-pulse"></span> Dispatching ${name}...`;
      status.style.color = "#38bdf8";

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/workflows/${file}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${pat}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (res.status === 204) {
          status.innerHTML = `<span class="live-pulse"></span> ${name} queued. Connecting live runner monitor...`;
          status.style.color = "#f59e0b";
          startLivePolling(name);
        } else {
          const err = await res.json().catch(() => ({}));
          status.innerHTML = `❌ Trigger failed: ${err.message || res.statusText}`;
          status.style.color = "#ef4444";
          btnQuick.disabled = false;
          btnFull.disabled = false;
        }
      } catch (e) {
        status.innerHTML = `Network error: ${e.message}`;
        status.style.color = "#ef4444";
        btnQuick.disabled = false;
        btnFull.disabled = false;
      }
    }

    // Live Polling Engine
    function startLivePolling(name) {
      if (livePollInterval) clearInterval(livePollInterval);
      const startTime = Date.now();
      const status = document.getElementById("statusText");

      livePollInterval = setInterval(async () => {
        const pat = localStorage.getItem("GH_PAT");
        if (!pat) return clearInterval(livePollInterval);

        try {
          const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/runs?per_page=1`, {
            headers: { "Authorization": `Bearer ${pat}` }
          });
          if (!res.ok) return;

          const data = await res.json();
          const run = data.workflow_runs?.[0];
          if (!run) return;

          const elapsedSec = Math.floor((Date.now() - startTime) / 1000);

          if (run.status === "in_progress") {
            status.innerHTML = `<span class="live-pulse"></span> ${name} running in cloud (${elapsedSec}s)...`;
            status.style.color = "#38bdf8";
          } else if (run.status === "queued") {
            status.innerHTML = `<span class="live-pulse"></span> ${name} queued in VM pool (${elapsedSec}s)...`;
            status.style.color = "#f59e0b";
          } else if (run.status === "completed") {
            clearInterval(livePollInterval);
            document.getElementById("btnQuickSync").disabled = false;
            document.getElementById("btnFullSync").disabled = false;

            if (run.conclusion === "success") {
              status.innerHTML = `🎉 ${name} completed in ${elapsedSec}s! Reloading catalog...`;
              status.style.color = "#10b981";
              setTimeout(() => loadCatalog(), 1500);
            } else {
              status.innerHTML = `❌ ${name} failed (${run.conclusion}). Check GitHub logs.`;
              status.style.color = "#ef4444";
            }
          }
        } catch (e) {}
      }, 2000);
    }

    async function checkRunStatus(manual = false) {
      const pat = localStorage.getItem("GH_PAT");
      const status = document.getElementById("statusText");
      if (!pat) return;

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/runs?per_page=1`, {
          headers: { "Authorization": `Bearer ${pat}` }
        });
        if (res.ok) {
          const data = await res.json();
          const run = data.workflow_runs?.[0];
          if (run) {
            status.innerHTML = `[${run.name}] ${run.status} (${run.conclusion || 'running'})`;
            status.style.color = run.conclusion === 'success' ? '#10b981' : '#f59e0b';
            if (manual) alert(`Latest GitHub Run:\nWorkflow: ${run.name}\nStatus: ${run.status}\nResult: ${run.conclusion || 'Active'}`);
          }
        }
      } catch (e) {}
    }
  </script>
