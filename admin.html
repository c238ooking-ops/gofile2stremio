<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Vault Pro - Admin</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141419;
      --card-hover: #1c1c24;
      --border: #23232c;
      --border-focus: #4f46e5;
      --text: #ffffff;
      --text-muted: #8b8b9e;
      --quick: #10b981;
      --primary: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 32px;
      min-height: 100vh;
    }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title span {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-quick { background-color: var(--quick); }
    .btn-quick:hover:not(:disabled) { background-color: #059669; }

    .btn-full { background-color: var(--primary); }
    .btn-full:hover:not(:disabled) { background-color: #2563eb; }

    .btn-auto {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
    }
    .btn-auto:hover:not(:disabled) {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
    }

    .btn-ghost {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover:not(:disabled) {
      color: var(--text);
      border-color: #3f3f50;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
    }
    .search-box:focus {
      outline: 1px solid var(--border-focus);
    }

    .filter-select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
    }

    .status-indicator {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Vault Grid */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    .vault-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .vault-card:hover {
      transform: translateY(-4px);
      border-color: #3b3b4f;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: #1a1a22;
      overflow: hidden;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-year {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .badge-count {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(16, 185, 129, 0.85);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
    }

    .badge-series {
      background: rgba(59, 130, 246, 0.85);
    }

    .card-meta {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-dialog {
      background: #15151c;
      border: 1px solid #2b2b3b;
      border-radius: 12px;
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .editor-section {
      background: #101016;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .field-group input, .field-group select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    .field-group input:focus {
      outline: 1px solid var(--border-focus);
    }

    .stream-item {
      background: #1a1a24;
      border: 1px solid #262634;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stream-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .stream-fname {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    .stream-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stream-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .stream-actions a, .stream-actions button {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 4px;
      text-decoration: none;
    }

    .footer-bar {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="brand-title">
      🎬 <span>Movie Vault Pro</span>
    </div>
    <div class="nav-actions">
      <button class="btn-ghost" onclick="loadCatalog()">🔄 Refresh Catalog</button>
      <button class="btn-quick" onclick="triggerWorkflow('quick_sync.yml', 'Quick Sync')">⚡ Quick Sync</button>
      <button class="btn-full" onclick="triggerWorkflow('crawler.yml', 'Full Crawl')">📦 Full Crawl</button>
      <button class="btn-ghost" onclick="checkRunStatus()">Check Status</button>
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchBox" class="search-box" placeholder="Search catalog by title, year, IMDb ID, or filename..." oninput="renderVaultGrid()" />
    <select id="typeFilter" class="filter-select" onchange="renderVaultGrid()">
      <option value="all">All Content</option>
      <option value="movie">Movies Only</option>
      <option value="series">Series & Franchises</option>
    </select>
    <div class="status-indicator" id="statusText">Awaiting catalog load...</div>
  </div>

  <div class="poster-grid" id="vaultGrid"></div>

  <!-- Modal Details & Original Metadata Form -->
  <div class="modal-backdrop" id="streamModal" onclick="closeModal(event)">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Edit Title</h3>
        <button class="btn-ghost" style="padding: 4px 8px;" onclick="document.getElementById('streamModal').style.display='none'">✕</button>
      </div>
      <div class="modal-body">
        
        <div class="editor-section">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
            <h4 style="font-size: 13px; color: #f8fafc;">Metadata Details</h4>
            <div style="display: flex; gap: 8px;">
              <button class="btn-auto" id="autoFetchBtn" style="padding: 5px 12px;" onclick="autoFetchMetadata()">✨ Auto IMDb</button>
              <button class="btn-quick" style="padding: 5px 12px;" onclick="saveMetadata()">💾 Save Metadata</button>
            </div>
          </div>
          
          <div class="editor-grid">
            <div class="field-group">
              <label>Title</label>
              <input type="text" id="editTitle" />
            </div>

            <div class="field-group">
              <label>IMDb ID (e.g. tt0111161)</label>
              <input type="text" id="editImdbId" placeholder="tt1234567" />
            </div>

            <div class="field-group">
              <label>Type</label>
              <select id="editType">
                <option value="movie">Movie</option>
                <option value="series">Series</option>
              </select>
            </div>

            <div class="field-group">
              <label>Poster URL</label>
              <input type="text" id="editPoster" placeholder="https://..." />
            </div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h4 style="font-size: 13px; color: #f8fafc;">Streams (<span id="modalStreamCount">0</span>)</h4>
        </div>
        <div id="modalStreamsList" style="display: flex; flex-direction: column; gap: 10px;"></div>

      </div>
    </div>
  </div>

  <div class="footer-bar">
    <span>GitHub PAT:</span>
    <input type="password" id="patInput" class="filter-select" placeholder="ghp_..." style="padding: 6px 10px; width: 220px;" />
    <button class="btn-ghost" onclick="savePat()">Save</button>
    <span style="margin-left: auto;" id="vaultStats">0 Titles | 0 Streams</span>
  </div>

  <script>
    const GITHUB_REPO_OWNER = "c238ooking-ops";
    const GITHUB_REPO_NAME = "gofile2stremio";
    const GITHUB_RAW = `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/main/data.json`;
    const WORKER_SYNC_URL = "https://gofile2stremio.c238ooking.workers.dev/sync";

    let rawStreams = [];
    let groupedCatalog = [];
    let currentActiveGroup = null;

    function savePat() {
      const p = document.getElementById("patInput").value.trim();
      if (p) {
        localStorage.setItem("GH_PAT", p);
        alert("GitHub Token saved!");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("GH_PAT");
      if (saved) document.getElementById("patInput").value = saved;
      loadCatalog();
    });

    async function loadCatalog() {
      const status = document.getElementById("statusText");
      status.innerText = "Loading catalog...";
      status.style.color = "#38bdf8";

      try {
        const res = await fetch(`${GITHUB_RAW}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        rawStreams = Array.isArray(data) ? data : (data.metas || data.streams || Object.values(data));

        aggregateCatalog();
        renderVaultGrid();

        status.innerText = `Ready (${groupedCatalog.length} titles active)`;
        status.style.color = "#10b981";
      } catch (e) {
        status.innerText = `Fetch error: ${e.message}`;
        status.style.color = "#ef4444";
      }
    }

    function aggregateCatalog() {
      const map = new Map();

      rawStreams.forEach(item => {
        const key = item.imdb_id || item.title;
        if (!map.has(key)) {
          let year = item.year || "";
          if (!year && item.title) {
            const ym = item.title.match(/\b(19\d\d|20\d\d)\b/);
            if (ym) year = ym[1];
          }

          map.set(key, {
            id: key,
            title: item.title || item.name,
            type: item.type || "movie",
            poster: item.poster && !item.poster.includes("logo-small") ? item.poster : "",
            year: year,
            streams: []
          });
        }

        const entry = map.get(key);
        if (!entry.poster && item.poster && !item.poster.includes("logo-small")) {
          entry.poster = item.poster;
        }
        entry.streams.push(item);
      });

      groupedCatalog = Array.from(map.values());
      groupedCatalog.sort((a, b) => a.title.localeCompare(b.title));
      document.getElementById("vaultStats").innerText = `${groupedCatalog.length} Titles | ${rawStreams.length} Total Streams`;
    }

    function renderVaultGrid() {
      const q = document.getElementById("searchBox").value.toLowerCase().trim();
      const filterType = document.getElementById("typeFilter").value;
      const grid = document.getElementById("vaultGrid");
      grid.innerHTML = "";

      const filtered = groupedCatalog.filter(group => {
        const matchesType = (filterType === "all") || (group.type === filterType);
        const matchesQuery = !q ||
          group.title.toLowerCase().includes(q) ||
          group.id.toLowerCase().includes(q) ||
          group.streams.some(s => s.name && s.name.toLowerCase().includes(q));
        return matchesType && matchesQuery;
      });

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "vault-card";
        card.onclick = () => openGroupModal(item);

        const isSeries = item.type === "series" || item.streams.length > 1;
        const countBadge = isSeries
          ? `<span class="badge-count badge-series">${item.streams.length} Eps</span>`
          : (item.streams[0]?.quality ? `<span class="badge-count">${item.streams[0].quality}</span>` : "");

        const fallbackPoster = `https://placehold.co/300x450/141419/8b8b9e?text=${encodeURIComponent(item.title)}`;
        const posterSrc = item.poster || fallbackPoster;

        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${posterSrc}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.src='${fallbackPoster}'" />
            ${item.year ? `<span class="badge-year">${item.year}</span>` : ""}
            ${countBadge}
          </div>
          <div class="card-meta">
            <div class="card-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
            <div class="card-sub">
              <span>${item.type.toUpperCase()}</span>
              <span>★</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openGroupModal(group) {
      currentActiveGroup = group;

      document.getElementById("modalTitle").innerText = group.title;
      document.getElementById("editTitle").value = group.title || "";
      document.getElementById("editImdbId").value = group.id || "";
      document.getElementById("editType").value = group.type || "movie";
      document.getElementById("editPoster").value = group.poster || "";
      document.getElementById("modalStreamCount").innerText = group.streams.length;

      const container = document.getElementById("modalStreamsList");
      container.innerHTML = "";

      const streams = [...group.streams].sort((a, b) => (a.season || 0) - (b.season || 0) || (a.episode || 0) - (b.episode || 0));

      streams.forEach(s => {
        const div = document.createElement("div");
        div.className = "stream-item";

        const label = s.season !== undefined && s.episode !== undefined 
          ? `S${String(s.season).padStart(2, '0')}E${String(s.episode).padStart(2, '0')}`
          : (s.edition || "Main Feature");

        div.innerHTML = `
          <div class="stream-info">
            <div class="stream-fname">${escapeHtml(label)} - ${escapeHtml(s.name || group.title)}</div>
            <div class="stream-desc">${escapeHtml(s.description || s.size || '')}</div>
          </div>
          <div class="stream-actions">
            <a href="${escapeHtml(s.link)}" target="_blank" class="btn-quick">Stream</a>
            <button class="btn-ghost" onclick="copyLink('${escapeHtml(s.link)}')">Copy</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById("streamModal").style.display = "flex";
    }

    // Original Cinemeta auto-fetch
    async function autoFetchMetadata() {
      const imdbId = document.getElementById("editImdbId").value.trim();
      const title = document.getElementById("editTitle").value.trim();
      const type = document.getElementById("editType").value;

      if (!imdbId && !title) {
        alert("Please enter an IMDb ID or a title.");
        return;
      }

      const btn = document.getElementById("autoFetchBtn");
      btn.disabled = true;
      btn.innerText = "Fetching...";

      try {
        if (imdbId.startsWith("tt")) {
          const res = await fetch(`https://v3-cinemeta.strem.io/meta/${type}/${imdbId}.json`);
          const data = await res.json();
          if (data && data.meta) {
            document.getElementById("editTitle").value = data.meta.name;
            if (data.meta.poster) document.getElementById("editPoster").value = data.meta.poster;
            alert(`Loaded: ${data.meta.name}`);
            return;
          }
        }

        const query = encodeURIComponent(title);
        const searchRes = await fetch(`https://v3-cinemeta.strem.io/catalog/${type}/top/search=${query}.json`);
        const searchData = await searchRes.json();
        const match = searchData?.metas?.[0];

        if (match) {
          document.getElementById("editImdbId").value = match.id;
          document.getElementById("editTitle").value = match.name;
          if (match.poster) document.getElementById("editPoster").value = match.poster;
          alert(`Found: ${match.name} (${match.id})`);
        } else {
          alert("No matches found on Cinemeta.");
        }
      } catch (err) {
        alert(`Error: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerText = "✨ Auto IMDb";
      }
    }

    // Original GitHub Save Metadata
    async function saveMetadata() {
      if (!currentActiveGroup) return;
      const pat = localStorage.getItem("GH_PAT");
      if (!pat) return alert("Save your GitHub PAT below first.");

      const newTitle = document.getElementById("editTitle").value.trim();
      const newImdbId = document.getElementById("editImdbId").value.trim();
      const newType = document.getElementById("editType").value;
      const newPoster = document.getElementById("editPoster").value.trim();

      currentActiveGroup.title = newTitle;
      currentActiveGroup.id = newImdbId;
      currentActiveGroup.type = newType;
      currentActiveGroup.poster = newPoster;

      currentActiveGroup.streams.forEach(s => {
        s.title = newTitle;
        s.imdb_id = newImdbId;
        s.type = newType;
        s.poster = newPoster;
        if (newType === "series") {
          s.stream_id = `${newImdbId}:${s.season || 1}:${s.episode || 1}`;
          s.stream_ids = [s.stream_id];
        } else {
          s.stream_id = newImdbId;
          s.stream_ids = [newImdbId];
        }
      });

      const status = document.getElementById("statusText");
      status.innerText = "Saving to GitHub...";

      try {
        const fileUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/data.json`;
        const getFile = await fetch(fileUrl, {
          headers: { "Authorization": `Bearer ${pat}`, "Accept": "application/vnd.github+json" }
        });
        if (!getFile.ok) throw new Error("Could not fetch current data.json from GitHub.");
        const fileData = await getFile.json();

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(rawStreams, null, 2))));
        const putFile = await fetch(fileUrl, {
          method: "PUT",
          headers: { "Authorization": `Bearer ${pat}`, "Accept": "application/vnd.github+json" },
          body: JSON.stringify({
            message: `Update metadata: ${newTitle}`,
            content: content,
            sha: fileData.sha
          })
        });

        if (!putFile.ok) throw new Error("GitHub rejected the file update.");

        try {
          await fetch(WORKER_SYNC_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(rawStreams)
          });
        } catch (e) {}

        alert("Saved successfully!");
        document.getElementById("streamModal").style.display = "none";
        aggregateCatalog();
        renderVaultGrid();
      } catch (err) {
        alert(`Save failed: ${err.message}`);
      }
    }

    // GitHub workflow dispatcher for both Quick and Full sync
    async function triggerWorkflow(file, name) {
      const pat = localStorage.getItem("GH_PAT");
      const status = document.getElementById("statusText");
      if (!pat) return alert("Save your GitHub PAT at the bottom of the page first.");

      status.innerText = `Dispatching ${name}...`;
      status.style.color = "#38bdf8";

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/workflows/${file}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${pat}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (res.status === 204) {
          status.innerText = `✅ ${name} queued. Check status in ~20 seconds.`;
          status.style.color = "#10b981";
        } else {
          const err = await res.json().catch(() => ({}));
          status.innerText = `Trigger error: ${err.message || res.statusText}`;
          status.style.color = "#ef4444";
        }
      } catch (e) {
        status.innerText = `Network error: ${e.message}`;
        status.style.color = "#ef4444";
      }
    }

    async function checkRunStatus() {
      const pat = localStorage.getItem("GH_PAT");
      const status = document.getElementById("statusText");
      if (!pat) return alert("Enter your PAT first.");

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/runs?per_page=1`, {
          headers: { "Authorization": `Bearer ${pat}` }
        });
        if (res.ok) {
          const data = await res.json();
          const run = data.workflow_runs?.[0];
          if (run) {
            status.innerText = `[${run.name}] ${run.status} (${run.conclusion || 'running'})`;
            status.style.color = run.conclusion === 'success' ? '#10b981' : '#f59e0b';
            alert(`Latest Run:\nWorkflow: ${run.name}\nStatus: ${run.status}\nConclusion: ${run.conclusion || 'in progress'}`);
          }
        }
      } catch (e) {}
    }

    function closeModal(e) {
      if (e.target.id === "streamModal") {
        document.getElementById("streamModal").style.display = "none";
      }
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => alert("Stream URL copied!"));
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
