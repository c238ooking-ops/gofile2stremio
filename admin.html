<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catalog Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1300px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    input, select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { background: #0284c7; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #0369a1; }
    button.save { background: #16a34a; }
    button.save:hover { background: #15803d; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; font-size: 14px; }
    th { background: #0f172a; position: sticky; top: 0; }
    .tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; background: #334155; }
    .tag.series { background: #6366f1; }
    .tag.movie { background: #0ea5e9; }
    .cell-input { width: 95%; background: transparent; border: 1px solid transparent; padding: 4px; }
    .cell-input:focus { background: #0f172a; border-color: #38bdf8; }
    .status { margin-left: 10px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>Gofile Stremio Library Editor</h2>
    <div class="controls">
      <input type="password" id="pat" placeholder="GitHub PAT (ghp_...)" style="width: 280px;">
      <input type="text" id="repo" placeholder="username/repo" style="width: 180px;">
      <button onclick="loadCatalog()">Load Catalog</button>
      <button class="save" onclick="saveCatalog()">Commit to GitHub</button>
      <span id="status" class="status"></span>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="Search titles, IMDb, or filenames..." oninput="filterTable()" style="flex-grow: 1;">
      <select id="typeFilter" onchange="filterTable()">
        <option value="all">All Types</option>
        <option value="movie">Movies</option>
        <option value="series">Series</option>
      </select>
    </div>
  </div>

  <div class="card" style="padding: 0; overflow-x: auto; max-height: 70vh;">
    <table>
      <thead>
        <tr>
          <th style="width: 60px;">Type</th>
          <th>Stremio Title</th>
          <th style="width: 130px;">IMDb ID</th>
          <th style="width: 110px;">Edition</th>
          <th style="width: 80px;">S / E</th>
          <th>Original File Name</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let catalogData = [];
  let fileSha = "";

  document.getElementById("pat").value = localStorage.getItem("gh_pat") || "";
  document.getElementById("repo").value = localStorage.getItem("gh_repo") || "";

  async function loadCatalog() {
    const pat = document.getElementById("pat").value.trim();
    const repo = document.getElementById("repo").value.trim();
    const status = document.getElementById("status");

    if (!pat || !repo) return alert("Provide GitHub Token and Repo name.");
    localStorage.setItem("gh_pat", pat);
    localStorage.setItem("gh_repo", repo);

    status.textContent = "Fetching data.json...";
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
        headers: { Authorization: `token ${pat}`, Accept: "application/vnd.github.v3+json" }
      });
      if (!res.ok) throw new Error(await res.text());
      const fileData = await res.json();
      fileSha = fileData.sha;
      catalogData = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
      renderTable();
      status.textContent = `Loaded ${catalogData.length} records.`;
    } catch (err) {
      status.textContent = "Error loading file.";
      alert(err.message);
    }
  }

  function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    catalogData.forEach((item, index) => {
      const tr = document.createElement("tr");
      tr.id = `row-${index}`;
      tr.innerHTML = `
        <td><span class="tag ${item.type}">${item.type}</span></td>
        <td><input class="cell-input" value="${item.title || ''}" onchange="updateEntry(${index}, 'title', this.value)"></td>
        <td><input class="cell-input" style="font-family: monospace;" value="${item.imdb_id || ''}" onchange="updateImdb(${index}, this.value)"></td>
        <td><input class="cell-input" value="${item.edition || ''}" placeholder="e.g. Open Matte" onchange="updateEntry(${index}, 'edition', this.value)"></td>
        <td>${item.type === 'series' ? `S${item.season} E${item.episode}` : '-'}</td>
        <td style="color: #94a3b8; font-size: 12px;">${item.name || ''}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function updateEntry(index, key, val) {
    catalogData[index][key] = val;
  }

  function updateImdb(index, newImdb) {
    newImdb = newImdb.trim();
    catalogData[index].imdb_id = newImdb;
    if (catalogData[index].type === 'series') {
      catalogData[index].stream_id = `${newImdb}:${catalogData[index].season}:${catalogData[index].episode}`;
    } else {
      catalogData[index].stream_id = newImdb;
    }
  }

  function filterTable() {
    const q = document.getElementById("search").value.toLowerCase();
    const type = document.getElementById("typeFilter").value;
    catalogData.forEach((item, i) => {
      const matchQuery = (item.title || "").toLowerCase().includes(q) ||
                         (item.imdb_id || "").toLowerCase().includes(q) ||
                         (item.name || "").toLowerCase().includes(q);
      const matchType = type === "all" || item.type === type;
      const el = document.getElementById(`row-${i}`);
      if (el) el.style.display = matchQuery && matchType ? "" : "none";
    });
  }

  async function saveCatalog() {
    const pat = document.getElementById("pat").value.trim();
    const repo = document.getElementById("repo").value.trim();
    const status = document.getElementById("status");

    if (!fileSha) return alert("Load catalog first!");
    status.textContent = "Committing to GitHub...";

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(catalogData, null, 2))));
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
        method: "PUT",
        headers: { Authorization: `token ${pat}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "Manual catalog update via Admin Dashboard [skip ci]",
          content: content,
          sha: fileSha
        })
      });
      if (!res.ok) throw new Error(await res.text());
      const resData = await res.json();
      fileSha = resData.content.sha;
      status.textContent = "Saved successfully!";
      alert("Changes committed to data.json successfully!");
    } catch (err) {
      status.textContent = "Save failed.";
      alert(err.message);
    }
  }
</script>
</body>
</html>
