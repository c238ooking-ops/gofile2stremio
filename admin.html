<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gofile Library & Metadata Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit-cover">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --border: #334155; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: #f8fafc; margin: 0;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .card { background: var(--panel); border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    input, select, button {
      padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: white; outline: none; font-size: 14px; min-height: 42px;
    }
    input:focus { border-color: var(--accent); }
    button { background: #0284c7; border: none; cursor: pointer; font-weight: 600; transition: 0.15s; touch-action: manipulation; }
    button:active { transform: scale(0.98); filter: brightness(1.1); }
    button.save { background: #16a34a; }
    button.regroup { background: #d97706; }
    button.sync { background: #8b5cf6; }
    button:disabled { opacity: 0.5; cursor: not allowed; }
    .table-container { overflow: auto; max-height: 72vh; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    th { background: #0b1120; position: sticky; top: 0; z-index: 10; font-size: 12px; text-transform: uppercase; color: #94a3b8; }
    .poster-thumb { width: 44px; height: 64px; object-fit: cover; border-radius: 5px; background: #334155; cursor: pointer; border: 1px solid #475569; display: block; }
    .tag { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .tag.series { background: #4f46e5; }
    .tag.movie { background: #0284c7; }
    .cell-input { width: 100%; background: transparent; border: 1px solid transparent; padding: 6px; color: white; border-radius: 6px; font-size: 13px; }
    .cell-input:focus { background: var(--bg); border-color: var(--accent); }
    .accordion-btn { background: #334155; padding: 8px 12px; font-size: 12px; border-radius: 6px; border: none; color: #e2e8f0; cursor: pointer; }
    .sub-table-row { background: #131b2e; display: none; }
    .sub-table-row.open { display: table-row; }
    .sub-table { width: 100%; border-collapse: collapse; background: #090e1a; border-radius: 6px; overflow: hidden; margin: 8px 0; }
    .sub-table td { border-bottom: 1px solid #1e293b; padding: 10px 12px; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h3 style="margin: 0 0 14px 0; font-size: 1.15rem;">Stremio Gofile Library & Metadata Manager</h3>
    <div class="controls">
      <input type="password" id="pat" placeholder="GitHub Token (ghp...)">
      <input type="text" id="repo" placeholder="owner/repo">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;">
        <button onclick="loadCatalog(true)">Load</button>
        <button class="save" onclick="saveCatalog()">Commit</button>
      </div>
      <span id="status" style="font-size: 13px; color: #94a3b8; font-weight: 500;"></span>
    </div>
    <div class="controls" style="margin-top: 10px;">
      <input type="text" id="search" placeholder="Search titles, IMDb IDs, filenames..." oninput="filterTable()">
      <select id="typeFilter" onchange="filterTable()">
        <option value="all">All Types</option>
        <option value="movie">Movies</option>
        <option value="series">Series</option>
      </select>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 46px;">Poster</th>
            <th style="width: 65px;">Type</th>
            <th>Catalog Title</th>
            <th style="width: 130px;">IMDb ID</th>
            <th style="width: 100px;">Edition</th>
            <th style="width: 180px;">Episodes & Variants</th>
            <th>File Source</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let rawCatalogData = [];
let fileSha = "";

document.getElementById("pat").value = localStorage.getItem("gh_pat") || "";
document.getElementById("repo").value = localStorage.getItem("gh_repo") || "";

async function loadCatalog(notify = false) {
  const pat = document.getElementById("pat").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const status = document.getElementById("status");
  if (!pat || !repo) return alert("Provide your GitHub PAT and repo name.");

  localStorage.setItem("gh_pat", pat);
  localStorage.setItem("gh_repo", repo);
  status.textContent = "Fetching fresh catalog...";

  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json?t=${Date.now()}`, {
      cache: "no-store",
      headers: { Authorization: `token ${pat}`, Accept: "application/vnd.github.v3+json" }
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    fileSha = data.sha;
    rawCatalogData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
    renderGroupedTable();
    status.textContent = `Active: ${rawCatalogData.length} files loaded.`;
    if (notify) alert(`Sync finished!\n\nTotal active files: ${rawCatalogData.length}`);
  } catch (err) {
    status.textContent = "Error loading catalog.";
    alert(err.message);
  }
}

function getGroupedData() {
  const seriesMap = {};
  const standaloneMovies = [];

  rawCatalogData.forEach((item, index) => {
    item._index = index;
    if (item.type === "series") {
      const groupKey = item.imdb_id || item.title;
      if (!seriesMap[groupKey]) {
        seriesMap[groupKey] = {
          key: groupKey,
          title: item.title,
          imdb_id: item.imdb_id,
          poster: item.poster,
          items: []
        };
      }
      seriesMap[groupKey].items.push(item);
    } else {
      standaloneMovies.push(item);
    }
  });

  Object.values(seriesMap).forEach(s => {
    s.items.sort((a, b) => {
      if (a.season !== b.season) return (a.season ?? 999) - (b.season ?? 999);
      if (a.episode !== b.episode) return (a.episode ?? 999) - (b.episode ?? 999);
      return (a.edition || "").localeCompare(b.edition || "");
    });
  });

  return { movies: standaloneMovies, series: Object.values(seriesMap) };
}

function renderGroupedTable() {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  const { movies, series } = getGroupedData();

  series.forEach((s, idx) => {
    const sRow = document.createElement("tr");
    sRow.className = "group-row";
    sRow.setAttribute("data-type", "series");
    sRow.setAttribute("data-search", `${s.title} ${s.imdb_id}`.toLowerCase());

    const posterSrc = s.poster || "https://gofile.io/dist/img/logo-small.png";
    sRow.innerHTML = `
      <td><img class="poster-thumb" src="${posterSrc}" alt=""></td>
      <td><span class="tag series">Series</span></td>
      <td><input class="cell-input" value="${s.title || ""}" onchange="updateSeriesGroup('${s.key}', 'title', this.value)"></td>
      <td><input class="cell-input" style="font-family: monospace;" value="${s.imdb_id || ""}" onchange="handleSeriesImdbChange('${s.key}', this.value)" placeholder="tt..."></td>
      <td><span style="color: #64748b; font-size: 11px;">(Per-Variant)</span></td>
      <td><button class="accordion-btn" onclick="toggleAccordion('acc-${idx}')">${s.items.length} Episodes & Cuts</button></td>
      <td style="color: #94a3b8; font-size: 11px;">Series Collection</td>
    `;
    tbody.appendChild(sRow);

    const subRow = document.createElement("tr");
    subRow.className = "sub-table-row";
    subRow.id = `acc-${idx}`;

    const itemRowsHtml = s.items.map(sub => {
      let epLabel = sub.season === 0 ? "Special / S0" : `S${sub.season} E${sub.episode}`;
      if (Array.isArray(sub.stream_ids) && sub.stream_ids.length > 1) {
        const eps = sub.stream_ids.map(id => id.split(":")[2]).join("+");
        epLabel = `S${sub.season} E${eps}`;
      }
      return `
        <tr>
          <td style="width: 120px; font-weight: 600; color: #38bdf8;">${epLabel}</td>
          <td style="width: 180px;"><input class="cell-input" value="${sub.edition || ""}" placeholder="Cut/Edition" onchange="updateSingleFile(${sub._index}, 'edition', this.value)"></td>
          <td style="color: #64748b; font-size: 11px; word-break: break-all;">${sub.name}</td>
        </tr>
      `;
    }).join("");

    subRow.innerHTML = `
      <td colspan="7" style="padding: 4px 15px 15px 15px;">
        <table class="sub-table">
          <thead>
            <tr style="background: #111827; color: #94a3b8; font-size: 11px;">
              <th>Episode Code</th>
              <th>Edition Tag / Cut</th>
              <th>Source File</th>
            </tr>
          </thead>
          <tbody>${itemRowsHtml}</tbody>
        </table>
      </td>
    `;
    tbody.appendChild(subRow);
  });

  movies.forEach(m => {
    const mRow = document.createElement("tr");
    mRow.className = "group-row";
    mRow.setAttribute("data-type", "movie");
    mRow.setAttribute("data-search", `${m.title} ${m.imdb_id} ${m.name}`.toLowerCase());

    const posterSrc = m.poster || "https://gofile.io/dist/img/logo-small.png";
    mRow.innerHTML = `
      <td><img class="poster-thumb" src="${posterSrc}" alt=""></td>
      <td><span class="tag movie">Movie</span></td>
      <td><input class="cell-input" value="${m.title || ""}" onchange="updateSingleFile(${m._index}, 'title', this.value)"></td>
      <td><input class="cell-input" style="font-family: monospace;" value="${m.imdb_id || ""}" onchange="handleMovieImdbChange(${m._index}, this.value)" placeholder="tt..."></td>
      <td><input class="cell-input" value="${m.edition || ""}" placeholder="Edition" onchange="updateSingleFile(${m._index}, 'edition', this.value)"></td>
      <td style="color: #64748b; font-size: 12px;">Standalone / Variant</td>
      <td style="color: #64748b; font-size: 11px; max-width: 320px; word-break: break-all;">${m.name}</td>
    `;
    tbody.appendChild(mRow);
  });
}

function toggleAccordion(id) {
  document.getElementById(id).classList.toggle("open");
}

function updateSingleFile(index, key, val) {
  rawCatalogData[index][key] = val;
}

function updateSeriesGroup(groupKey, key, val) {
  rawCatalogData.forEach(item => {
    if ((item.imdb_id || item.title) === groupKey) {
      item[key] = val;
    }
  });
}

function handleMovieImdbChange(index, newImdb) {
  const item = rawCatalogData[index];
  if (!item) return;
  item.imdb_id = newImdb.trim();
  item.stream_id = item.imdb_id;
  item.stream_ids = [item.imdb_id];
  renderGroupedTable();
}

function handleSeriesImdbChange(groupKey, newImdb) {
  const cleanId = newImdb.trim();
  rawCatalogData.forEach(item => {
    if ((item.imdb_id || item.title) === groupKey) {
      item.imdb_id = cleanId;
      if (Array.isArray(item.stream_ids)) {
        item.stream_ids = item.stream_ids.map(s => `${cleanId}:${s.split(":")[1]}:${s.split(":")[2]}`);
        item.stream_id = item.stream_ids[0];
      } else {
        item.stream_id = `${cleanId}:${item.season}:${item.episode}`;
        item.stream_ids = [item.stream_id];
      }
    }
  });
  renderGroupedTable();
}

function filterTable() {
  const q = document.getElementById("search").value.toLowerCase();
  const type = document.getElementById("typeFilter").value;
  document.querySelectorAll(".group-row").forEach(row => {
    const matchesSearch = row.getAttribute("data-search").includes(q);
    const matchesType = type === "all" || row.getAttribute("data-type") === type;
    row.style.display = matchesSearch && matchesType ? "" : "none";
  });
}

async function saveCatalog() {
  const pat = document.getElementById("pat").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const status = document.getElementById("status");
  if (!fileSha) return alert("Load the catalog first!");

  status.textContent = "Committing metadata...";
  const cleanOutput = rawCatalogData.map(item => {
    const copy = { ...item };
    delete copy._index;
    return copy;
  });

  const content = btoa(unescape(encodeURIComponent(JSON.stringify(cleanOutput, null, 2))));
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
      method: "PUT",
      headers: { Authorization: `token ${pat}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "Update media metadata via Manager [skip ci]",
        content: content,
        sha: fileSha
      })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    fileSha = data.content.sha;
    status.textContent = "Saved successfully!";
    alert("Successfully committed changes to data.json");
  } catch (err) {
    status.textContent = "Save failed.";
    alert(err.message);
  }
}
</script>
</body>
</html>
