<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Vault Pro</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141419;
      --border: #23232c;
      --border-focus: #4f46e5;
      --text: #ffffff;
      --text-muted: #8b8b9e;
      --quick: #10b981;
      --primary: #3b82f6;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 32px;
      min-height: 100vh;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title span {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-quick { background-color: var(--quick); }
    .btn-quick:hover:not(:disabled) { background-color: #059669; }

    .btn-full { background-color: var(--primary); }
    .btn-full:hover:not(:disabled) { background-color: #2563eb; }

    .btn-auto {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
    }
    .btn-auto:hover:not(:disabled) {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
    }

    .btn-ghost {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover:not(:disabled) {
      color: var(--text);
      border-color: #3f3f50;
    }

    /* Filter Toolbar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
    }
    .search-box:focus {
      outline: 1px solid var(--border-focus);
    }

    .filter-select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
    }

    .status-indicator {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Poster Grid */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    .vault-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .vault-card:hover {
      transform: translateY(-4px);
      border-color: #3b3b4f;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: #1a1a22;
      overflow: hidden;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-year {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .badge-count {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(16, 185, 129, 0.85);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
    }

    .badge-series {
      background: rgba(59, 130, 246, 0.85);
    }

    .card-meta {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-dialog {
      background: #15151c;
      border: 1px solid #2b2b3b;
      border-radius: 12px;
      width: 100%;
      max-width: 860px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Collapsible Editor Section */
    .editor-section {
      display: none;
      background: #101016;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.15s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .field-group input, .field-group select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    .field-group input:focus {
      outline: 1px solid var(--border-focus);
    }

    /* Stream Row */
    .stream-item {
      background: #1a1a24;
      border: 1px solid #262634;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stream-row-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stream-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .stream-fname {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    .stream-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stream-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .stream-actions a, .stream-actions button {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 4px;
      text-decoration: none;
    }

    /* Hidden in-line edit inputs for stream */
    .stream-edit-row {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      align-items: flex-end;
    }

    .footer-bar {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header-bar">
    <div class="brand-title">
      🎬 <span>Movie Vault Pro</span>
    </div>
    <div class="nav-actions">
      <button class="btn-ghost" onclick="loadCatalog()">🔄 Refresh Catalog</button>
      <button class="btn-quick" onclick="triggerWorkflow('quick_sync.yml', 'Quick Sync')">⚡ Quick Sync</button>
      <button class="btn-full" onclick="triggerWorkflow('crawler.yml', 'Full Crawl')">📦 Full Sync</button>
      <button class="btn-ghost" onclick="checkRunStatus()">Status</button>
    </div>
  </div>

  <!-- Search and Filters -->
  <div class="filter-bar">
    <input type="text" id="searchBox" class="search-box" placeholder="Search catalog by title, year, IMDb ID, or filename..." oninput="renderVaultGrid()" />
    <select id="typeFilter" class="filter-select" onchange="renderVaultGrid()">
      <option value="all">All Content</option>
      <option value="movie">Movies Only</option>
      <option value="series">Series & Franchises</option>
    </select>
    <div class="status-indicator" id="statusText">Awaiting catalog load...</div>
  </div>

  <!-- Poster Gallery -->
  <div class="poster-grid" id="vaultGrid"></div>

  <!-- Modal Details & Editor -->
  <div class="modal-backdrop" id="streamModal" onclick="closeModal(event)">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Streams</h3>
        <div style="display: flex; gap: 8px;">
          <button class="btn-ghost" id="toggleEditBtn" onclick="toggleEditMode()">⚙️ Edit Metadata</button>
          <button class="btn-ghost" style="padding: 4px 8px;" onclick="document.getElementById('streamModal').style.display='none'">✕</button>
        </div>
      </div>
      <div class="modal-body">
        
        <!-- Collapsible Edit Section -->
        <div class="editor-section" id="editorSection">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
            <h4 style="font-size: 13px; color: #f8fafc;">Group Metadata</h4>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="btn-ghost" style="padding: 5px 10px;" onclick="autoConsolidateSpecials()">🎬 Auto Consolidate Specials</button>
              <button class="btn-auto" id="autoFetchBtn" style="padding: 5px 10px;" onclick="autoFetchMetadata()">✨ Auto IMDb</button>
              <button class="btn-quick" style="padding: 5px 10px;" onclick="saveGroupMetadata()">💾 Save Changes</button>
            </div>
          </div>
          
          <div class="editor-grid">
            <div class="field-group">
              <label>Canonical Title</label>
              <input type="text" id="editTitle" />
            </div>

            <div class="field-group">
              <label>IMDb ID / Anchor</label>
              <input type="text" id="editImdbId" placeholder="tt1234567 or gf:..." />
            </div>

            <div class="field-group">
              <label>Media Type</label>
              <select id="editType">
                <option value="movie">Movie</option>
                <option value="series">Series</option>
              </select>
            </div>

            <div class="field-group">
              <label>Poster Image URL</label>
              <input type="text" id="editPoster" placeholder="https://..." />
            </div>
          </div>
        </div>

        <!-- Stream / Episode List -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h4 style="font-size: 13px; color: #f8fafc;">Available Streams (<span id="modalStreamCount">0</span>)</h4>
        </div>
        <div id="modalStreamsList" style="display: flex; flex-direction: column; gap: 10px;"></div>

      </div>
    </div>
  </div>

  <!-- Settings Footer -->
  <div class="footer-bar">
    <span>GitHub PAT:</span>
    <input type="password" id="patInput" class="filter-select" placeholder="ghp_..." style="padding: 6px 10px; width: 220px;" />
    <button class="btn-ghost" onclick="savePat()">Save</button>
    <span style="margin-left: auto;" id="vaultStats">0 Titles | 0 Streams</span>
  </div>

  <script>
    const GITHUB_REPO_OWNER = "c238ooking-ops";
    const GITHUB_REPO_NAME = "gofile2stremio";
    const WORKER_CATALOG_URL = "https://gofile2stremio.c238ooking.workers.dev/catalog";
    const WORKER_SYNC_URL = "https://gofile2stremio.c238ooking.workers.dev/sync";
    const GITHUB_RAW = `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/main/data.json`;

    let rawStreams = [];
    let groupedCatalog = [];
    let currentActiveGroup = null;
    let isEditMode = false;

    function savePat() {
      const p = document.getElementById("patInput").value.trim();
      if (p) {
        localStorage.setItem("GH_PAT", p);
        alert("GitHub Token saved!");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("GH_PAT");
      if (saved) document.getElementById("patInput").value = saved;
      loadCatalog();
    });

    async function loadCatalog() {
      const status = document.getElementById("statusText");
      status.innerText = "Loading streams...";
      status.style.color = "#38bdf8";

      try {
        let res = await fetch(`${GITHUB_RAW}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) res = await fetch(WORKER_CATALOG_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("Could not load data.json or worker catalog.");

        const data = await res.json();
        rawStreams = Array.isArray(data) ? data : (data.metas || data.streams || Object.values(data));

        aggregateCatalog();
        renderVaultGrid();

        status.innerText = `Ready (${groupedCatalog.length} titles active)`;
        status.style.color = "#10b981";
      } catch (e) {
        status.innerText = `Fetch error: ${e.message}`;
        status.style.color = "#ef4444";
      }
    }

    function aggregateCatalog() {
      const map = new Map();

      rawStreams.forEach(item => {
        const key = item.imdb_id || item.title;
        if (!map.has(key)) {
          let year = item.year || "";
          if (!year && item.title) {
            const ym = item.title.match(/\b(19\d\d|20\d\d)\b/);
            if (ym) year = ym[1];
          }

          map.set(key, {
            id: key,
            title: item.title || item.name,
            type: item.type || "movie",
            poster: item.poster && !item.poster.includes("logo-small") ? item.poster : "",
            year: year,
            streams: []
          });
        }

        const entry = map.get(key);
        if (!entry.poster && item.poster && !item.poster.includes("logo-small")) {
          entry.poster = item.poster;
        }
        entry.streams.push(item);
      });

      groupedCatalog = Array.from(map.values());
      groupedCatalog.sort((a, b) => a.title.localeCompare(b.title));
      document.getElementById("vaultStats").innerText = `${groupedCatalog.length} Titles | ${rawStreams.length} Total Streams`;
    }

    function renderVaultGrid() {
      const q = document.getElementById("searchBox").value.toLowerCase().trim();
      const filterType = document.getElementById("typeFilter").value;
      const grid = document.getElementById("vaultGrid");
      grid.innerHTML = "";

      const filtered = groupedCatalog.filter(group => {
        const matchesType = (filterType === "all") || (group.type === filterType);
        const matchesQuery = !q ||
          group.title.toLowerCase().includes(q) ||
          group.id.toLowerCase().includes(q) ||
          group.streams.some(s => s.name && s.name.toLowerCase().includes(q));
        return matchesType && matchesQuery;
      });

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "vault-card";
        card.onclick = () => openGroupModal(item);

        const isSeries = item.type === "series" || item.streams.length > 1;
        const countBadge = isSeries
          ? `<span class="badge-count badge-series">${item.streams.length} Eps</span>`
          : (item.streams[0]?.quality ? `<span class="badge-count">${item.streams[0].quality}</span>` : "");

        const fallbackPoster = `https://placehold.co/300x450/141419/8b8b9e?text=${encodeURIComponent(item.title)}`;
        const posterSrc = item.poster || fallbackPoster;

        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${posterSrc}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.src='${fallbackPoster}'" />
            ${item.year ? `<span class="badge-year">${item.year}</span>` : ""}
            ${countBadge}
          </div>
          <div class="card-meta">
            <div class="card-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
            <div class="card-sub">
              <span>${item.type.toUpperCase()}</span>
              <span>★</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // --- Modal Open & Toggle Edit ---
    function openGroupModal(group) {
      currentActiveGroup = group;
      isEditMode = false; // Always start in classy, clean view

      document.getElementById("editorSection").style.display = "none";
      document.getElementById("toggleEditBtn").innerText = "⚙️ Edit Metadata";

      document.getElementById("modalTitle").innerText = group.title;
      document.getElementById("editTitle").value = group.title || "";
      document.getElementById("editImdbId").value = group.id || "";
      document.getElementById("editType").value = group.type || "movie";
      document.getElementById("editPoster").value = group.poster || "";
      document.getElementById("modalStreamCount").innerText = group.streams.length;

      renderModalStreamRows(group);
      document.getElementById("streamModal").style.display = "flex";
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const editor = document.getElementById("editorSection");
      const btn = document.getElementById("toggleEditBtn");
      const subEdits = document.querySelectorAll(".stream-edit-row");

      if (isEditMode) {
        editor.style.display = "flex";
        btn.innerText = "✕ Close Editor";
        subEdits.forEach(el => el.style.display = "grid");
      } else {
        editor.style.display = "none";
        btn.innerText = "⚙️ Edit Metadata";
        subEdits.forEach(el => el.style.display = "none");
      }
    }

    // --- Render Modal Stream Rows ---
    function renderModalStreamRows(group) {
      const container = document.getElementById("modalStreamsList");
      container.innerHTML = "";

      const streams = [...group.streams].sort((a, b) => (a.season || 0) - (b.season || 0) || (a.episode || 0) - (b.episode || 0));

      streams.forEach(s => {
        const div = document.createElement("div");
        div.className = "stream-item";

        const label = s.season !== undefined && s.episode !== undefined 
          ? `S${String(s.season).padStart(2, '0')}E${String(s.episode).padStart(2, '0')}`
          : (s.edition || "Main Feature");

        // Options for "Move to Series / Movie" Mix & Match
        let moveOptions = groupedCatalog.map(g => `<option value="${escapeHtml(g.id)}" ${g.id === group.id ? 'selected' : ''}>${escapeHtml(g.title)}</option>`).join("");

        div.innerHTML = `
          <div class="stream-row-main">
            <div class="stream-info">
              <div class="stream-fname">${escapeHtml(label)} - ${escapeHtml(s.name || group.title)}</div>
              <div class="stream-desc">${escapeHtml(s.description || s.size || '')}</div>
            </div>
            <div class="stream-actions">
              <a href="${escapeHtml(s.link)}" target="_blank" class="btn-quick">Stream</a>
              <button class="btn-ghost" onclick="copyLink('${escapeHtml(s.link)}')">Copy</button>
            </div>
          </div>

          <!-- Hidden in-line edit inputs -->
          <div class="stream-edit-row" style="display: ${isEditMode ? 'grid' : 'none'};">
            <div class="field-group">
              <label>Move to Entry</label>
              <select onchange="moveStreamToGroup('${s.file_id}', this.value)">
                ${moveOptions}
              </select>
            </div>
            <div class="field-group">
              <label>Season</label>
              <input type="number" value="${s.season ?? 1}" onchange="updateStreamProp('${s.file_id}', 'season', parseInt(this.value))" />
            </div>
            <div class="field-group">
              <label>Episode</label>
              <input type="number" value="${s.episode ?? 1}" onchange="updateStreamProp('${s.file_id}', 'episode', parseInt(this.value))" />
            </div>
            <div class="field-group">
              <label>Quality</label>
              <input type="text" value="${escapeHtml(s.quality || '1080P')}" onchange="updateStreamProp('${s.file_id}', 'quality', this.value)" />
            </div>
            <div class="field-group">
              <label>Tag / Edition</label>
              <input type="text" value="${escapeHtml(s.edition || '')}" onchange="updateStreamProp('${s.file_id}', 'edition', this.value)" />
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // --- Mix & Match: Move File to Another Entry ---
    function moveStreamToGroup(fid, targetGroupId) {
      const streamIndex = rawStreams.findIndex(s => s.file_id === fid);
      if (streamIndex === -1) return;

      const targetGroup = groupedCatalog.find(g => g.id === targetGroupId);
      if (!targetGroup) return;

      const stream = rawStreams[streamIndex];
      stream.title = targetGroup.title;
      stream.imdb_id = targetGroup.id;
      stream.type = targetGroup.type;
      stream.poster = targetGroup.poster;

      if (targetGroup.type === "series") {
        stream.season = 1;
        stream.episode = targetGroup.streams.length + 1;
        stream.stream_id = `${targetGroup.id}:${stream.season}:${stream.episode}`;
        stream.stream_ids = [stream.stream_id];
      } else {
        delete stream.season;
        delete stream.episode;
        stream.stream_id = targetGroup.id;
        stream.stream_ids = [targetGroup.id];
      }

      alert(`Moved "${stream.name}" to "${targetGroup.title}". Click "Save Changes" to apply.`);
      aggregateCatalog();
      // Re-find active group and re-render
      const updated = groupedCatalog.find(g => g.id === currentActiveGroup.id);
      if (updated) {
        currentActiveGroup = updated;
        renderModalStreamRows(updated);
      } else {
        document.getElementById("streamModal").style.display = "none";
      }
      renderVaultGrid();
    }

    // --- Auto-Consolidate Specials ---
    function autoConsolidateSpecials() {
      if (!currentActiveGroup) return;

      let specialIndex = 1;
      let consolidatedCount = 0;

      currentActiveGroup.streams.forEach(s => {
        const lower = (s.name || "").toLowerCase();
        if (
          lower.includes("special") ||
          lower.includes("extra") ||
          lower.includes("bonus") ||
          lower.includes("featurette") ||
          lower.includes("interview") ||
          lower.includes("deleted")
        ) {
          s.season = 0;
          s.episode = specialIndex++;
          s.edition = (s.edition ? s.edition + " | " : "") + "Special";
          s.stream_id = `${s.imdb_id}:0:${s.episode}`;
          s.stream_ids = [s.stream_id];
          consolidatedCount++;
        }
      });

      if (consolidatedCount > 0) {
        alert(`Consolidated ${consolidatedCount} files into Season 0 (Specials).`);
        renderModalStreamRows(currentActiveGroup);
      } else {
        alert("No files with special tags (special, extra, bonus, etc.) were found in this entry.");
      }
    }

    function updateStreamProp(fid, prop, value) {
      const stream = rawStreams.find(s => s.file_id === fid);
      if (stream) {
        stream[prop] = value;
        if (stream.type === "series" && (prop === "season" || prop === "episode")) {
          stream.stream_id = `${stream.imdb_id}:${stream.season}:${stream.episode}`;
          stream.stream_ids = [stream.stream_id];
        }
      }
    }

    // --- Save Group Changes to GitHub & KV ---
    async function saveGroupMetadata() {
      if (!currentActiveGroup) return;
      const pat = localStorage.getItem("GH_PAT");
      if (!pat) return alert("GitHub Token is required to commit changes. Enter and save it below.");

      const newTitle = document.getElementById("editTitle").value.trim();
      const newImdbId = document.getElementById("editImdbId").value.trim();
      const newType = document.getElementById("editType").value;
      const newPoster = document.getElementById("editPoster").value.trim();

      currentActiveGroup.title = newTitle;
      currentActiveGroup.id = newImdbId;
      currentActiveGroup.type = newType;
      currentActiveGroup.poster = newPoster;

      currentActiveGroup.streams.forEach(s => {
        s.title = newTitle;
        s.imdb_id = newImdbId;
        s.type = newType;
        s.poster = newPoster;
        if (newType === "series") {
          s.stream_id = `${newImdbId}:${s.season || 1}:${s.episode || 1}`;
          s.stream_ids = [s.stream_id];
        } else {
          s.stream_id = newImdbId;
          s.stream_ids = [newImdbId];
        }
      });

      const status = document.getElementById("statusText");
      status.innerText = "Commiting metadata changes to GitHub...";
      status.style.color = "#38bdf8";

      try {
        const fileUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/data.json`;
        const getFile = await fetch(fileUrl, {
          headers: {
            "Authorization": `Bearer ${pat}`,
            "Accept": "application/vnd.github+json"
          }
        });

        if (!getFile.ok) throw new Error("Failed reading data.json from GitHub repository.");
        const fileData = await getFile.json();
        const sha = fileData.sha;

        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(rawStreams, null, 2))));
        const putFile = await fetch(fileUrl, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${pat}`,
            "Accept": "application/vnd.github+json"
          },
          body: JSON.stringify({
            message: `✏️ Update metadata: ${newTitle}`,
            content: contentEncoded,
            sha: sha
          })
        });

        if (!putFile.ok) throw new Error("Failed to write commit to GitHub.");

        try {
          await fetch(WORKER_SYNC_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(rawStreams)
          });
        } catch (kvErr) {}

        status.innerText = "✅ Saved successfully to GitHub & KV!";
        status.style.color = "#10b981";
        alert("Changes committed to GitHub and synced with Cloudflare KV!");
        document.getElementById("streamModal").style.display = "none";
        aggregateCatalog();
        renderVaultGrid();
      } catch (e) {
        status.innerText = `Save error: ${e.message}`;
        status.style.color = "#ef4444";
        alert(`Save failed: ${e.message}`);
      }
    }

    // --- Clean title logic for Auto Fetch ---
    function cleanQueryName(raw) {
      let base = raw.replace(/\.[^/.]+$/, "");
      base = base.replace(/^@[\w\.\-]+(?:\s*-\s*|\s+)/i, "");
      base = base.replace(/^\d{1,3}\s*[\.\-]+\s*(?!\d*x\d+)/i, "");
      base = base.replace(/\[.*?\]/g, " ");
      base = base.replace(/\b(19\d\d|20\d\d)\b.*$/i, "");
      base = base.replace(/[-_.]+/g, " ");
      base = base.replace(/\b(open\s*matte|imax|web\s*dl|webrip|bluray|dvdrip|1080p|720p|4k|hevc|x264|x265|hindi|dual\s*audio|remux)\b.*$/i, "");
      return base.trim();
    }

    // --- Auto Fetch IMDb API ---
    async function autoFetchMetadata() {
      const btn = document.getElementById("autoFetchBtn");
      const titleInput = document.getElementById("editTitle");
      const currentTitle = titleInput.value.trim() || (currentActiveGroup?.streams[0]?.name || "");
      const cleaned = cleanQueryName(currentTitle);

      if (!cleaned) return alert("Please enter a title to query IMDb.");

      btn.disabled = true;
      btn.innerText = "🔍 Querying...";

      try {
        const query = encodeURIComponent(cleaned.toLowerCase().replace(/\s+/g, "_"));
        const targetUrl = `https://v3.sg.media-imdb.com/suggestion/x/${query}.json`;
        
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        let res = await fetch(proxyUrl);
        if (!res.ok) res = await fetch(targetUrl);

        const data = await res.json();
        const items = data.d || [];
        const match = items.find(i => i.id && i.id.startsWith("tt"));

        if (!match) {
          alert(`No IMDb suggestions found for: "${cleaned}"`);
          return;
        }

        document.getElementById("editTitle").value = match.l || cleaned;
        document.getElementById("editImdbId").value = match.id;
        
        const isTv = match.q && match.q.toLowerCase().includes("tv");
        document.getElementById("editType").value = isTv ? "series" : "movie";

        if (match.i && match.i.imageUrl) {
          document.getElementById("editPoster").value = match.i.imageUrl;
        }

        alert(`Found IMDb Match!\nTitle: ${match.l}\nID: ${match.id}`);
      } catch (err) {
        alert(`Notice: ${err.message}. You can manually paste the IMDb ID.`);
      } finally {
        btn.disabled = false;
        btn.innerText = "✨ Auto IMDb";
      }
    }

    function closeModal(e) {
      if (e.target.id === "streamModal") {
        document.getElementById("streamModal").style.display = "none";
      }
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => alert("Stream URL copied!"));
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // --- GitHub Actions Workflow Trigger ---
    async function triggerWorkflow(file, name) {
      const pat = localStorage.getItem("GH_PAT");
      const status = document.getElementById("statusText");
      if (!pat) return alert("Enter and save your GitHub Personal Access Token below.");

      status.innerText = `🚀 Triggering ${name}...`;
      status.style.color = "#38bdf8";

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/workflows/${file}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${pat}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (res.status === 204) {
          status.innerText = `✅ ${name} running in background (~20s)...`;
          status.style.color = "#10b981";
        } else {
          const err = await res.json().catch(() => ({}));
          status.innerText = `❌ Trigger failed: ${err.message || res.statusText}`;
          status.style.color = "#ef4444";
        }
      } catch (e) {
        status.innerText = `Network error: ${e.message}`;
        status.style.color = "#ef4444";
      }
    }

    async function checkRunStatus() {
      const pat = localStorage.getItem("GH_PAT");
      const status = document.getElementById("statusText");
      if (!pat) return;

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/actions/runs?per_page=1`, {
          headers: { "Authorization": `Bearer ${pat}` }
        });
        if (res.ok) {
          const data = await res.json();
          const run = data.workflow_runs?.[0];
          if (run) {
            status.innerText = `[${run.name}] ${run.status} (${run.conclusion || 'running'})`;
            status.style.color = run.conclusion === 'success' ? '#10b981' : '#f59e0b';
          }
        }
      } catch (e) {}
    }
  </script>
